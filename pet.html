<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もふもふペット育成記</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
        margin: 0;
        background: linear-gradient(#1e3a8a, #0f172a);
        font-family: 'Hiragino Maru Gothic ProN', 'Arial Rounded MT Bold', 'Arial', sans-serif;
        color: #1f2937;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
        min-height: 100vh;
    }
    #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 8px 10px 24px;
    }
    .panel {
        background: #fffdf7;
        border: 4px solid #78350f;
        border-radius: 18px;
        box-shadow: 0 8px 0 rgba(0,0,0,0.35);
    }
    canvas {
        display: block;
        width: 100%;
        border-radius: 12px;
        background: #bae6fd;
    }
    .bar-outer {
        background: #e5e7eb;
        border: 2px solid #6b7280;
        border-radius: 999px;
        height: 14px;
        overflow: hidden;
    }
    .bar-inner {
        height: 100%;
        width: 0%;
        transition: width 0.3s linear;
    }
    .game-btn {
        background-color: #f59e0b;
        color: #fff;
        padding: 0.6rem 0.2rem;
        font-size: clamp(0.72rem, 3.1vw, 0.95rem);
        line-height: 1.25;
        border-bottom: 4px solid #b45309;
        border-radius: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.1s;
        text-align: center;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
    .game-btn:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
    }
    .game-btn.blue { background-color: #3b82f6; border-bottom-color: #1d4ed8; }
    .game-btn.green { background-color: #10b981; border-bottom-color: #047857; }
    .game-btn.purple { background-color: #8b5cf6; border-bottom-color: #6d28d9; }
    .game-btn.pink { background-color: #ec4899; border-bottom-color: #be185d; }
    .game-btn.gray { background-color: #64748b; border-bottom-color: #334155; }
    .game-btn.disabled {
        opacity: 0.45;
        pointer-events: none;
    }
    .game-btn.view-off {
        filter: grayscale(0.65);
        opacity: 0.5;
    }
    #log {
        height: 74px;
        overflow: hidden;
        font-size: 0.8rem;
        line-height: 1.5;
    }
    #modal-back {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
    }
    #modal {
        max-height: 84vh;
        overflow-y: auto;
        background: #fffdf7;
        border: 5px solid #78350f;
        border-radius: 20px;
        padding: 18px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #mini-track {
        position: relative;
        height: 34px;
        background: #e2e8f0;
        border: 3px solid #334155;
        border-radius: 8px;
        overflow: hidden;
    }
    #mini-zone {
        position: absolute;
        top: 0; bottom: 0;
        left: 40%;
        width: 20%;
        background: #fde68a;
        border-left: 2px dashed #f59e0b;
        border-right: 2px dashed #f59e0b;
    }
    #mini-perfect {
        position: absolute;
        top: 0; bottom: 0;
        left: 47%;
        width: 6%;
        background: #fca5a5;
    }
    #mini-marker {
        position: absolute;
        top: -3px;
        width: 6px;
        height: 40px;
        background: #dc2626;
        margin-left: -3px;
    }
    .stat-label { font-size: 0.7rem; font-weight: bold; }
</style>
</head>
<body>
<div id="app">
    <div class="panel p-3 mb-2">
        <div class="flex justify-between items-center mb-2">
            <div class="font-bold text-lg" id="pet-name">たまご</div>
            <div class="text-sm font-bold text-amber-700" id="coin-view">🪙 0</div>
        </div>
        <canvas id="stage"></canvas>
        <div class="grid grid-cols-2 gap-2 mt-2">
            <div class="game-btn green" id="btn-view-out" onclick="setView('out')">🌳 そと</div>
            <div class="game-btn" id="btn-view-in" style="background:#a16207;border-bottom-color:#713f12" onclick="setView('in')">🏠 おうちのなか</div>
        </div>
        <div class="flex justify-between text-xs font-bold mt-2 text-gray-600">
            <span id="stage-view">たまご</span>
            <span id="age-view">0日目</span>
            <span id="power-view">ちから 0</span>
        </div>
    </div>

    <div class="panel p-3 mb-2">
        <div class="grid grid-cols-2 gap-x-3 gap-y-1">
            <div>
                <div class="stat-label">🍖 おなか <span id="hunger-num"></span></div>
                <div class="bar-outer"><div class="bar-inner" id="hunger-bar" style="background:#f97316"></div></div>
            </div>
            <div>
                <div class="stat-label">💛 きげん <span id="happy-num"></span></div>
                <div class="bar-outer"><div class="bar-inner" id="happy-bar" style="background:#eab308"></div></div>
            </div>
            <div>
                <div class="stat-label">🫧 きれい <span id="clean-num"></span></div>
                <div class="bar-outer"><div class="bar-inner" id="clean-bar" style="background:#38bdf8"></div></div>
            </div>
            <div>
                <div class="stat-label">⚡ げんき <span id="energy-num"></span></div>
                <div class="bar-outer"><div class="bar-inner" id="energy-bar" style="background:#22c55e"></div></div>
            </div>
            <div>
                <div class="stat-label">❤️ たいりょく <span id="hp-num"></span></div>
                <div class="bar-outer"><div class="bar-inner" id="hp-bar" style="background:#ef4444"></div></div>
            </div>
            <div>
                <div class="stat-label">⭐ Lv <span id="level-num">1</span></div>
                <div class="bar-outer"><div class="bar-inner" id="exp-bar" style="background:#a855f7"></div></div>
            </div>
        </div>
    </div>

    <div class="panel p-2 mb-2">
        <div id="log" class="px-1"></div>
    </div>

    <div class="grid grid-cols-4 gap-2 mb-2">
        <div class="game-btn" id="btn-feed" onclick="openFoodMenu()">🍚 ごはん</div>
        <div class="game-btn blue" id="btn-play" onclick="startPlay()">🎾 あそぶ</div>
        <div class="game-btn purple" id="btn-train" onclick="doTrain()">💪 きたえる</div>
        <div class="game-btn" id="btn-job" style="background:#d97706;border-bottom-color:#92400e" onclick="openJobMenu()">💼 おしごと</div>
        <div class="game-btn green" id="btn-bath" onclick="doBath()">🛁 おふろ</div>
        <div class="game-btn pink" id="btn-clean" onclick="doCleanPoop()">🧹 そうじ</div>
        <div class="game-btn gray" id="btn-sleep" onclick="toggleSleep()">💤 ねる</div>
        <div class="game-btn" id="btn-med" style="background:#14b8a6;border-bottom-color:#0f766e" onclick="useMedicine()">💊 くすり</div>
    </div>
    <div class="grid grid-cols-2 gap-2">
        <div class="game-btn gray" id="btn-status" onclick="openStatus()">📖 ずかん</div>
        <div class="game-btn" id="btn-shop" style="background:#0ea5e9;border-bottom-color:#0369a1" onclick="openShop()">🛒 ショップ</div>
    </div>
</div>

<div id="modal-back"><div id="modal"></div></div>

<script>
"use strict";

const SAVE_KEY = 'pet_raising_save_v1';
const DAY_SEC = 180;          // ゲーム内1日 = 実時間3分
const OFFLINE_CAP = 6 * 3600; // 放置は最大6時間ぶんまで反映

const SPECIES = {
    baby:    { name: 'ベビモフ',   body: '#a7f3d0', accent: '#34d399', ear: 'round',  acc: 'none'  },
    child:   { name: 'モフっこ',   body: '#93c5fd', accent: '#3b82f6', ear: 'long',   acc: 'none'  },
    power:   { name: 'マッチョン', body: '#fca5a5', accent: '#ef4444', ear: 'horn',   acc: 'band'  },
    cheer:   { name: 'ゲンキー',   body: '#fde68a', accent: '#f59e0b', ear: 'star',   acc: 'none'  },
    gourmet: { name: 'モグモン',   body: '#f9a8d4', accent: '#ec4899', ear: 'round',  acc: 'bib'   },
    royal:   { name: 'プリンセア', body: '#c4b5fd', accent: '#8b5cf6', ear: 'long',   acc: 'crown' }
};

const FOODS = {
    rice:  { label: '🍚 ふつうのごはん', cost: 5,  hunger: 25, happy: 4,  exp: 3, eat: 1 },
    feast: { label: '🍖 ごうかディナー', cost: 25, hunger: 50, happy: 14, exp: 8, eat: 2 },
    cake:  { label: '🍰 おやつのケーキ', cost: 12, hunger: 10, happy: 24, exp: 3, eat: 1 }
};

const MEDICINE_COST = 30;

// おしごと: ちからと レベルが たかいほど おだちんが ふえる
const JOBS = [
    { id: 'weed',  label: '🌿 くさむしり',   energy: 12, hunger: 8,  happy: 3, minPower: 0, minLevel: 1,
      base: 12, perPower: 2, perLevel: 1 },
    { id: 'carry', label: '📦 にもつはこび', energy: 25, hunger: 15, happy: 6, minPower: 3, minLevel: 1,
      base: 28, perPower: 4, perLevel: 2 },
    { id: 'shop',  label: '🏪 おみせばん',   energy: 18, hunger: 10, happy: 4, minPower: 0, minLevel: 5,
      base: 22, perPower: 2, perLevel: 3 }
];

function jobPay(j) {
    const raw = j.base + state.power * j.perPower + state.level * j.perLevel;
    return Math.round(raw * (has('bank') ? 1.2 : 1));
}

// おさらが あると ごはんが すこし やすくなる
function foodCost(f) { return has('dish') ? Math.max(1, Math.round(f.cost * 0.8)) : f.cost; }

const SHOP = [
    { id: 'doll',    cat: 'room', label: '🧸 ぬいぐるみ',         cost: 60,  note: 'きげんが へりにくくなる' },
    { id: 'plant',   cat: 'room', label: '🪴 かんようしょくぶつ', cost: 90,  note: 'きれいが へりにくくなる' },
    { id: 'shelf',   cat: 'room', label: '📚 ほんだな',           cost: 120, note: 'トレーニングの けいけんちアップ' },
    { id: 'tv',      cat: 'room', label: '📺 テレビ',             cost: 180, note: 'あそびの きげんアップ' },
    { id: 'dish',    cat: 'room', label: '🍽 ごはんの おさら',      cost: 60,  note: 'ごはんが 2わり やすくなる' },
    { id: 'bin',     cat: 'room', label: '🗑 ゴミばこ',             cost: 80,  note: 'そうじで コインが もらえる' },
    { id: 'clock',   cat: 'room', label: '🕰 かべどけい',           cost: 90,  note: 'いまの じかんが わかる' },
    { id: 'curtain', cat: 'room', label: '🪟 カーテン',             cost: 70,  note: 'よるは しまって ぐっすり ねむれる' },
    { id: 'toilet',  cat: 'room', label: '🚽 ペットトイレ',         cost: 140, note: 'うんちが トイレに はいる' },
    { id: 'aircon',  cat: 'room', label: '❄️ エアコン',             cost: 200, note: 'げんきが へりにくくなる' },
    { id: 'bank',    cat: 'room', label: '🐷 ちょきんばこ',         cost: 250, note: 'おしごとの おだちんが 2わり アップ' },
    { id: 'tree',    cat: 'yard', label: '🌳 おおきな き',        cost: 100, note: 'げんきが へりにくくなる' },
    { id: 'flower',  cat: 'yard', label: '🌷 はなだん',           cost: 70,  note: 'きげんが すこし へりにくくなる' },
    { id: 'post',    cat: 'yard', label: '📮 ポスト',             cost: 90,  note: 'ときどき コインが とどく' },
    { id: 'rainbow', cat: 'yard', label: '🌈 にじ',               cost: 150, note: 'みため だけ' },
    { id: 'ribbon',  cat: 'wear', label: '🎀 リボン',             cost: 80,  note: 'みため だけ' },
    { id: 'hat',     cat: 'wear', label: '👒 むぎわらぼうし',     cost: 110, note: 'みため だけ' },
    { id: 'glasses', cat: 'wear', label: '👓 めがね',             cost: 130, note: 'みため だけ' }
];

const SHOP_CAT = [
    ['room', '🏠 おうちのなか'],
    ['yard', '🌳 そと'],
    ['wear', '✨ みにつける']
];

let state = null;
let particles = [];
let action = { type: null, until: 0, dur: 1, food: null };
let mini = { active: false, pos: 0, dir: 1, speed: 0.8 };
let canvas, ctx, lastFrame = 0, saveTimer = 0;
let petPos = 0.5;          // ペットの立ち位置（キャンバス幅にたいする割合）
let petHidden = false;     // そとから見て おうちの中に いるか
let inBed = false;         // へやの ベッドで ねているか

const HOUSE_X = 0.80;      // おうちの中心
const DOOR_X = 0.775;      // げんかんの位置
const BED_X = 0.72;        // ベッドの位置
const IN_X = 0.40;         // へやでの ふだんの 立ち位置

/* ---------------- utility ---------------- */

const now = () => Date.now() / 1000;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const el = (id) => document.getElementById(id);

function expNeeded(level) { return 20 + level * 15; }

// ショップで かったか どうか
function has(id) { return !!(state.owned && state.owned[id]); }

function currentSpecies() {
    if (state.stage === 'baby') return SPECIES.baby;
    if (state.stage === 'child') return SPECIES.child;
    if (state.stage === 'adult') return SPECIES[state.species] || SPECIES.cheer;
    return SPECIES.baby;
}

function petScale() {
    if (state.stage === 'baby') return 0.62;
    if (state.stage === 'child') return 0.85;
    if (state.stage === 'adult') return 1.1;
    return 1;
}

function addLog(text) {
    state.log.unshift(text);
    if (state.log.length > 5) state.log.length = 5;
    renderLog();
}

function renderLog() {
    el('log').innerHTML = state.log
        .map((m, i) => `<div style="opacity:${1 - i * 0.18}">${m}</div>`)
        .join('');
}

function burst(type, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 90,
            y: canvas.height * 0.62 - Math.random() * 40,
            vx: (Math.random() - 0.5) * 30,
            vy: -30 - Math.random() * 40,
            life: 1.2,
            type: type
        });
    }
}

function setAction(type, sec, food) {
    action.type = type;
    action.until = now() + sec;
    action.dur = sec;
    action.food = food || null;
}

// アクションの しんこう度（0→1）
function actionProgress() {
    if (!action.type) return 1;
    return clamp(1 - (action.until - now()) / action.dur, 0, 1);
}

/* ---------------- state ---------------- */

function newState() {
    const t = now();
    return {
        version: 1,
        name: 'たまご',
        stage: 'egg',
        species: null,
        tap: 0,
        lastTick: t,
        ageSec: 0,
        hunger: 80, happy: 80, clean: 100, energy: 100, hp: 100,
        level: 1, exp: 0, coins: 60, power: 0,
        sleeping: false, sick: false, sickTimer: 0,
        poops: [], poopTimer: 90, postTimer: 180, jobs: 0,
        view: 'out',
        owned: {},
        wearing: null,
        care: { eat: 0, play: 0, train: 0, clean: 0 },
        log: ['たまごが とどいた！ タップして あたためよう。'],
        exhausted: false
    };
}

function save() {
    try {
        state.lastTick = now();
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) { /* 保存できない環境でも遊べるようにする */ }
}

function load() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || s.version !== 1) return null;
        if (!s.owned) s.owned = {};        // ショップより まえの セーブ
        if (!('wearing' in s)) s.wearing = null;
        if (typeof s.postTimer !== 'number') s.postTimer = 180;
        return s;
    } catch (e) {
        return null;
    }
}

/* ---------------- time progression ---------------- */

function applyTime(dt) {
    state.ageSec += dt;

    if (state.stage === 'egg') return;

    const m = dt / 60;

    if (state.sleeping) {
        state.energy = clamp(state.energy + (has('curtain') ? 20 : 16) * m, 0, 100);
        state.hunger = clamp(state.hunger - 2 * m, 0, 100);
        state.happy = clamp(state.happy - 0.5 * m, 0, 100);
        if (state.energy >= 100) {
            state.sleeping = false;
            addLog(`${state.name} は ぐっすり ねて めをさました！`);
        }
    } else {
        // ショップで かったものは へる はやさを ゆるめる
        const happyRate = 2.5 * (has('doll') ? 0.85 : 1) * (has('flower') ? 0.9 : 1);
        const energyRate = 1.6 * (has('tree') ? 0.85 : 1) * (has('aircon') ? 0.85 : 1);
        // トイレが あれば うんちで よごれにくい
        const dirtPerPoop = has('toilet') ? 1 : 3;
        const cleanRate = (2 + state.poops.length * dirtPerPoop) * (has('plant') ? 0.85 : 1);
        state.hunger = clamp(state.hunger - 3.2 * m, 0, 100);
        state.happy = clamp(state.happy - happyRate * m, 0, 100);
        state.energy = clamp(state.energy - energyRate * m, 0, 100);
        state.clean = clamp(state.clean - cleanRate * m, 0, 100);

        state.poopTimer -= dt;
        if (state.poopTimer <= 0) {
            state.poopTimer = 90 + Math.random() * 70;
            if (state.poops.length < 5) {
                // ペットや おうちに かぶらないよう ひだり手前に ならべる
                state.poops.push({ x: 0.06 + state.poops.length * 0.05 + Math.random() * 0.02 });
            }
        }
    }

    if (has('post')) {                      // ポストに ときどき コインが とどく
        state.postTimer -= dt;
        if (state.postTimer <= 0) {
            const times = Math.min(10, 1 + Math.floor(-state.postTimer / 180));
            state.postTimer = 180;
            state.coins += 5 * times;
            addLog(`📮 ポストに コインが とどいていた！ (+${5 * times}🪙)`);
        }
    }

    // 病気の判定
    const bad = state.clean < 12 || state.hunger < 12 || state.poops.length >= 4;
    if (!state.sick) {
        state.sickTimer = bad ? state.sickTimer + dt : Math.max(0, state.sickTimer - dt);
        if (state.sickTimer > 40) {
            state.sick = true;
            state.sickTimer = 0;
            addLog(`⚠ ${state.name} が びょうきに なってしまった…！`);
        }
    }

    if (state.sick) {
        state.hp = clamp(state.hp - 3 * m, 0, 100);
        state.happy = clamp(state.happy - 4 * m, 0, 100);
    } else if (state.hunger < 8 || state.happy < 5) {
        state.hp = clamp(state.hp - 2 * m, 0, 100);
    } else if (state.hunger > 40 && state.happy > 40 && state.clean > 40) {
        state.hp = clamp(state.hp + 2.5 * m, 0, 100);
    }

    // どんなに ほうっておかれても たいりょくは 1 で ふみとどまる（おわかれは しない）
    if (state.hp < 1) state.hp = 1;
    if (state.hp <= 1) {
        if (!state.exhausted) {
            state.exhausted = true;
            addLog(`${state.name} が ぐったりしている… おせわして あげよう！`);
        }
    } else if (state.hp > 30) {
        state.exhausted = false;
    }
}

/* ---------------- growth ---------------- */

function gainExp(n) {
    state.exp += n;
    let need = expNeeded(state.level);
    while (state.exp >= need) {
        state.exp -= need;
        state.level++;
        state.coins += 20;
        addLog(`🎉 レベル ${state.level} に あがった！ (+20🪙)`);
        need = expNeeded(state.level);
    }
    checkEvolve();
}

function checkEvolve() {
    if (state.stage === 'baby' && state.level >= 4) {
        state.stage = 'child';
        addLog(`✨ ${state.name} は こどもに せいちょうした！`);
        burst('star', 18);
        setAction('happy', 2);
    } else if (state.stage === 'child' && state.level >= 9) {
        const c = state.care;
        const pairs = [
            ['train', c.train, 'power'],
            ['play', c.play, 'cheer'],
            ['eat', c.eat, 'gourmet'],
            ['clean', c.clean, 'royal']
        ];
        pairs.sort((a, b) => b[1] - a[1]);
        state.species = pairs[0][2];
        state.stage = 'adult';
        addLog(`✨ ${state.name} は 「${SPECIES[state.species].name}」に しんかした！`);
        burst('star', 30);
        setAction('happy', 3);
    }
}

/* ---------------- actions ---------------- */

function busy() {
    if (state.stage === 'egg') { addLog('たまごを タップして あたためよう！'); return true; }
    if (state.sleeping) { addLog(`${state.name} は ぐっすり ねむっている…`); return true; }
    return false;
}

function openFoodMenu() {
    if (busy()) return;
    const rows = Object.keys(FOODS).map((k) => {
        const f = FOODS[k];
        const cost = foodCost(f);
        const poor = state.coins < cost;
        return `<div class="game-btn ${poor ? 'disabled' : ''} mb-2" onclick="feed('${k}')">
            ${f.label}<span class="text-xs"> / ${cost}🪙</span></div>`;
    }).join('');
    showModal(`<div class="font-bold text-lg mb-3">なにを たべる？</div>${rows}
        <div class="game-btn gray mt-1" onclick="hideModal()">やめる</div>`);
}

function feed(key) {
    hideModal();
    if (busy()) return;
    const f = FOODS[key];
    const cost = foodCost(f);
    if (state.coins < cost) { addLog('コインが たりない…'); return; }
    if (state.hunger > 95) { addLog(`${state.name}「おなか いっぱいだよ〜」`); return; }

    state.coins -= cost;
    state.hunger = clamp(state.hunger + f.hunger, 0, 100);
    state.happy = clamp(state.happy + f.happy, 0, 100);
    state.care.eat += f.eat;
    state.poopTimer = Math.min(state.poopTimer, 45);
    setAction('eat', 3, key);
    burst('heart', 5);
    addLog(`${f.label} を たべた！ おいしそう。`);
    gainExp(f.exp);
    save();
}

function startPlay() {
    if (busy()) return;
    if (state.energy < 10) { addLog(`${state.name} は つかれている… ねかせてあげよう。`); return; }
    if (state.hunger < 10) { addLog(`${state.name} は おなかが ぺこぺこだ…`); return; }
    mini.active = true;
    mini.pos = 0;
    mini.dir = 1;
    mini.speed = 0.75 + Math.min(0.9, state.level * 0.05);
    showModal(`
        <div class="font-bold text-lg mb-1">🎾 ボールキャッチ</div>
        <div class="text-xs mb-3 text-gray-600">まんなかで ストップ！</div>
        <div id="mini-track">
            <div id="mini-zone"></div>
            <div id="mini-perfect"></div>
            <div id="mini-marker" style="left:0%"></div>
        </div>
        <div class="game-btn blue mt-4" onclick="stopMini()">ストップ！</div>
    `, false);
}

function stopMini() {
    if (!mini.active) return;
    mini.active = false;
    hideModal();

    const d = Math.abs(mini.pos - 0.5);
    let coins, happy, label;
    if (d < 0.03) { coins = 30; happy = 26; label = 'パーフェクト！！'; }
    else if (d < 0.10) { coins = 18; happy = 18; label = 'グッド！'; }
    else if (d < 0.22) { coins = 10; happy = 12; label = 'まあまあ…'; }
    else { coins = 3; happy = 6; label = 'ざんねん…'; }

    state.coins += coins;
    state.happy = clamp(state.happy + happy * (has('tv') ? 1.3 : 1), 0, 100);
    state.energy = clamp(state.energy - 12, 0, 100);
    state.hunger = clamp(state.hunger - 8, 0, 100);
    state.clean = clamp(state.clean - 6, 0, 100);
    state.care.play += 1;
    setAction('play', 2.5);
    burst('heart', 8);
    addLog(`${label} いっしょに あそんだ！ (+${coins}🪙)`);
    gainExp(8);
    save();
}

function openJobMenu() {
    if (busy()) return;
    const rows = JOBS.map(function (j) {
        const lackPower = state.power < j.minPower;
        const lackLevel = state.level < j.minLevel;
        const tired = state.energy < j.energy || state.hunger < j.hunger;
        const ng = lackPower || lackLevel || tired;
        let why = '';
        if (lackPower) why = `ちから ${j.minPower} から`;
        else if (lackLevel) why = `レベル ${j.minLevel} から`;
        else if (tired) why = 'げんきか おなかが たりない';
        else why = `げんき -${j.energy} / おなか -${j.hunger}`;
        return `<div class="flex items-center gap-2 mb-2">
            <div class="text-left text-sm" style="flex:1">
                <div class="font-bold">${j.label}</div>
                <div class="text-xs text-gray-500">${why}</div>
            </div>
            <div style="width:40%">
                <div class="game-btn ${ng ? 'disabled' : ''}" onclick="doJob('${j.id}')">${jobPay(j)}🪙 もらう</div>
            </div>
        </div>`;
    }).join('');
    showModal(`<div class="font-bold text-lg mb-1">💼 おしごと</div>
        <div class="text-xs text-gray-600 mb-3">ちからと レベルが あがると おだちんも ふえるよ</div>
        ${rows}
        <div class="game-btn gray mt-2" onclick="hideModal()">やめる</div>`);
}

function doJob(id) {
    hideModal();
    if (busy()) return;
    const j = JOBS.filter(function (x) { return x.id === id; })[0];
    if (!j) return;
    if (state.power < j.minPower) { addLog(`まだ ちからが たりない…`); return; }
    if (state.level < j.minLevel) { addLog(`まだ レベルが たりない…`); return; }
    if (state.energy < j.energy || state.hunger < j.hunger) { addLog(`げんきか おなかが たりない…`); return; }

    const pay = jobPay(j);
    state.energy = clamp(state.energy - j.energy, 0, 100);
    state.hunger = clamp(state.hunger - j.hunger, 0, 100);
    state.happy = clamp(state.happy - j.happy, 0, 100);
    state.clean = clamp(state.clean - 8, 0, 100);
    state.coins += pay;
    state.jobs = (state.jobs || 0) + 1;
    setAction('work', 2.5, id);
    burst('star', 6);
    addLog(`${j.label} を がんばった！ おだちん ${pay}🪙`);
    gainExp(10);
    save();
}

function doTrain() {
    if (busy()) return;
    if (state.energy < 20) { addLog(`げんきが たりない… やすませてあげよう。`); return; }
    if (state.hunger < 15) { addLog(`おなかが すいて トレーニングできない…`); return; }

    state.energy = clamp(state.energy - 20, 0, 100);
    state.hunger = clamp(state.hunger - 12, 0, 100);
    state.happy = clamp(state.happy - 5, 0, 100);
    state.clean = clamp(state.clean - 10, 0, 100);
    state.power += 1;
    state.coins += 8;
    state.care.train += 1;
    setAction('train', 2.5);
    burst('sweat', 6);
    addLog(`💪 トレーニング！ ちからが ${state.power} に なった (+8🪙)`);
    gainExp(has('shelf') ? 20 : 15);
    save();
}

function doBath() {
    if (busy()) return;
    if (state.clean > 95) { addLog(`${state.name} は ぴかぴかだ！`); return; }
    state.clean = 100;
    state.happy = clamp(state.happy + 6, 0, 100);
    state.care.clean += 1;
    setAction('bath', 3.5);
    burst('bubble', 12);
    addLog(`🛁 おふろで ごしごし！ ぴかぴかに なった。`);
    gainExp(4);
    save();
}

function doCleanPoop() {
    if (busy()) return;
    if (state.poops.length === 0) { addLog('そうじする ところは なさそうだ。'); return; }
    const n = state.poops.length;
    state.poops = [];
    state.clean = clamp(state.clean + 18 * n, 0, 100);
    state.happy = clamp(state.happy + 4, 0, 100);
    state.care.clean += 1;
    burst('bubble', 8);
    if (has('bin')) {
        const tip = 5 * n;
        state.coins += tip;
        addLog(`🧹 うんちを ${n}こ ゴミばこに すてた！ (+${tip}🪙)`);
    } else {
        addLog(`🧹 うんちを ${n}こ かたづけた！`);
    }
    gainExp(3);
    save();
}

function isOutside() { return state.view !== 'in'; }

function petTarget() {
    if (isOutside()) return state.sleeping ? DOOR_X : 0.5;
    return state.sleeping ? BED_X : IN_X;
}

function setView(v) {
    if (state.view === v) return;
    state.view = v;
    petPos = petTarget();            // ばしょが かわるので すぐ そこに立たせる
    addLog(v === 'in' ? `🏠 おうちの なかに はいった。` : `🌳 そとに でた。`);
    save();
    updateUI();
}

function toggleSleep() {
    if (state.stage === 'egg') return;
    if (state.sleeping) {
        state.sleeping = false;
        addLog(isOutside() ? `${state.name} が おうちから でてきた！` : `${state.name} が ベッドから おきた！`);
    } else {
        if (state.energy >= 98) {
            // げんきが まんタンだと すぐ おきてしまうので おうちに いれない
            addLog(`${state.name} は げんきいっぱいで ねむくないみたい。`);
            return;
        }
        state.sleeping = true;
        addLog(isOutside()
            ? `🏠 ${state.name} は おうちに はいって ねむりについた…`
            : `🛏 ${state.name} は ベッドに もぐりこんだ…`);
    }
    save();
    updateUI();
}

function useMedicine() {
    if (busy()) return;
    if (!state.sick) { addLog(`${state.name} は げんきだ！ おくすりは いらない。`); return; }
    if (state.coins < MEDICINE_COST) { addLog(`コインが たりない…（おくすりは ${MEDICINE_COST}🪙）`); return; }
    state.coins -= MEDICINE_COST;
    state.sick = false;
    state.sickTimer = 0;
    state.hp = clamp(state.hp + 20, 0, 100);
    state.happy = clamp(state.happy + 8, 0, 100);
    burst('star', 8);
    addLog(`💊 おくすりを のんだ。 びょうきが なおった！`);
    save();
}

function openShop() {
    let html = `<div class="font-bold text-lg mb-1">🛒 ショップ</div>
        <div class="text-sm font-bold text-amber-700 mb-3">もっているコイン ${state.coins}🪙</div>`;
    SHOP_CAT.forEach(function (pair) {
        const cat = pair[0];
        html += `<div class="text-xs font-bold text-gray-600 text-left mt-3 mb-1">${pair[1]}</div>`;
        SHOP.filter(function (it) { return it.cat === cat; }).forEach(function (it) {
            const owned = has(it.id);
            let btn;
            if (!owned) {
                const poor = state.coins < it.cost;
                btn = `<div class="game-btn ${poor ? 'disabled' : ''}" onclick="buyItem('${it.id}')">${it.cost}🪙 で かう</div>`;
            } else if (it.cat === 'wear') {
                const on = state.wearing === it.id;
                btn = `<div class="game-btn ${on ? 'pink' : 'gray'}" onclick="wearItem('${it.id}')">${on ? 'はずす' : 'つける'}</div>`;
            } else {
                btn = `<div class="game-btn gray disabled">かざってある</div>`;
            }
            html += `<div class="flex items-center gap-2 mb-2">
                <div class="text-left text-sm" style="flex:1">
                    <div class="font-bold">${it.label}</div>
                    <div class="text-xs text-gray-500">${it.note}</div>
                </div>
                <div style="width:38%">${btn}</div>
            </div>`;
        });
    });
    html += `<div class="game-btn gray mt-3" onclick="hideModal()">とじる</div>`;
    showModal(html);
}

function buyItem(id) {
    const it = SHOP.filter(function (x) { return x.id === id; })[0];
    if (!it || has(id)) return;
    if (state.coins < it.cost) { addLog('コインが たりない…'); return; }
    state.coins -= it.cost;
    state.owned[id] = true;
    if (it.cat === 'wear') state.wearing = id;
    burst('star', 10);
    addLog(`🛒 ${it.label} を かった！`);
    save();
    updateUI();
    openShop();
}

function wearItem(id) {
    if (!has(id)) return;
    state.wearing = state.wearing === id ? null : id;
    addLog(state.wearing ? `${state.name} は ${SHOP.filter(function (x) { return x.id === id; })[0].label} を つけた！` : `${state.name} は みにつけていたものを はずした。`);
    save();
    openShop();
}

function openStatus() {
    const c = state.care;
    const sp = currentSpecies();
    showModal(`
        <div class="font-bold text-lg mb-2">📖 ${state.name} の ずかん</div>
        <div class="text-sm text-left leading-6">
            すがた：${sp.name}<br>
            レベル：${state.level}（つぎまで ${expNeeded(state.level) - state.exp}）<br>
            ねんれい：${Math.floor(state.ageSec / DAY_SEC)}日目<br>
            ちから：${state.power}<br>
            コイン：${state.coins}🪙<br>
            <hr class="my-2">
            <span class="text-xs text-gray-600">おせわの きろく</span><br>
            🍚 ごはん ${c.eat} / 🎾 あそび ${c.play}<br>
            💪 きたえた ${c.train} / 🫧 おそうじ ${c.clean}<br>
            💼 おしごと ${state.jobs || 0}かい
        </div>
        <div class="text-xs text-gray-500 mt-2">ちからと レベルが あがると おしごとの おだちんが ふえるよ</div>
        <div class="text-xs text-gray-500 mt-3">Lv9で いちばん おおい おせわの すがたに しんかするよ</div>
        <div class="game-btn gray mt-3" onclick="hideModal()">とじる</div>
        <div class="game-btn pink mt-2" onclick="confirmReset()">🔄 さいしょから</div>
    `);
}

function confirmReset() {
    showModal(`
        <div class="font-bold text-lg mb-3">さいしょから はじめる？</div>
        <div class="text-sm mb-4 text-gray-600">いまの ペットの きろくは きえてしまうよ。</div>
        <div class="game-btn pink mb-2" onclick="hardReset()">はじめる</div>
        <div class="game-btn gray" onclick="hideModal()">やめる</div>
    `);
}

function hardReset() {
    hideModal();
    state = newState();
    particles = [];
    action = { type: null, until: 0, dur: 1, food: null };
    save();
    renderLog();
    updateUI();
}

/* ---------------- egg / naming ---------------- */

function tapCanvas() {
    if (state.stage === 'egg') {
        state.tap++;
        setAction('shake', 0.4);
        if (state.tap >= 8) {
            hatch();
        } else if (state.tap % 3 === 0) {
            addLog('たまごが ぴくぴく うごいている…！');
        }
        return;
    }
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 1, 0, 100);
    setAction('happy', 0.8);
    burst('heart', 2);
}

function hatch() {
    state.stage = 'baby';
    state.name = 'ベビモフ';
    burst('star', 24);
    setAction('happy', 2);
    addLog('🥚 たまごが われた！ ペットが うまれた！');
    save();
    showModal(`
        <div class="font-bold text-lg mb-2">たまごが かえった！</div>
        <div class="text-sm mb-3">なまえを つけてあげよう</div>
        <input id="name-input" maxlength="8" value="モフ" class="border-2 border-amber-700 rounded-lg px-3 py-2 text-center w-full mb-3">
        <div class="game-btn" onclick="decideName()">けってい</div>
    `, false);
    setTimeout(() => { const i = el('name-input'); if (i) i.focus(); }, 50);
}

function decideName() {
    const input = el('name-input');
    const v = input && input.value.trim() ? input.value.trim().slice(0, 8) : 'モフ';
    state.name = v;
    hideModal();
    addLog(`なまえは 「${v}」に きまった！ よろしくね。`);
    save();
    updateUI();
}

/* ---------------- modal ---------------- */

function showModal(html, closable) {
    el('modal').innerHTML = html;
    el('modal-back').style.display = 'flex';
    el('modal-back').dataset.closable = closable === false ? '0' : '1';
}

function hideModal() {
    el('modal-back').style.display = 'none';
}

/* ---------------- drawing ---------------- */

function resize() {
    const w = canvas.clientWidth;
    const h = Math.round(w * 0.62);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function cw() { return canvas.width / (window.devicePixelRatio || 1); }
function ch() { return canvas.height / (window.devicePixelRatio || 1); }

function mood() {
    if (state.sleeping) return 'sleep';
    if (action.type === 'eat') return 'eat';
    if (action.type === 'happy' || action.type === 'play' || action.type === 'bath') return 'joy';
    if (action.type === 'train' || action.type === 'work') return 'train';
    if (state.sick) return 'sick';
    if (state.hp < 25 || state.hunger < 20 || state.happy < 20 || state.clean < 20) return 'sad';
    if (state.happy > 70) return 'joy';
    return 'normal';
}

function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawBackground(t) {
    const W = cw(), H = ch();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    if (state.sleeping) { g.addColorStop(0, '#1e293b'); g.addColorStop(1, '#334155'); }
    else { g.addColorStop(0, '#bae6fd'); g.addColorStop(1, '#e0f2fe'); }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (state.sleeping) {
        ctx.fillStyle = '#fef9c3';
        ellipse(W * 0.18, H * 0.19, 16, 16);
        ctx.fillStyle = 'rgba(202,191,120,0.55)';
        ellipse(W * 0.18 - 5, H * 0.19 - 4, 3.5, 3);
        ellipse(W * 0.18 + 4, H * 0.19 + 3, 4.5, 3.5);
        ellipse(W * 0.18 + 5, H * 0.19 - 6, 2.5, 2);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 12; i++) {
            const x = (i * 97 % Math.round(W));
            const y = (i * 53 % Math.round(H * 0.55));
            ctx.fillRect(x, y, 2, 2);
        }
    } else {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        const cx = (t * 12) % (W + 120) - 60;
        ellipse(cx, H * 0.2, 26, 14);
        ellipse(cx + 22, H * 0.2, 18, 11);
        ellipse(cx - 20, H * 0.22, 16, 10);
    }

    // 床
    ctx.fillStyle = state.sleeping ? '#4c1d95' : '#86efac';
    ctx.fillRect(0, H * 0.76, W, H * 0.24);
    ctx.fillStyle = state.sleeping ? '#5b21b6' : '#4ade80';
    ctx.fillRect(0, H * 0.76, W, 6);
}

function drawHouse(t) {
    const W = cw(), H = ch();
    const s = W / 380;
    const night = state.sleeping;

    ctx.save();
    ctx.translate(W * HOUSE_X, H * 0.79);
    ctx.scale(s, s);

    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ellipse(0, 8, 54, 8);

    // えんとつ
    ctx.fillStyle = night ? '#7c2d12' : '#9a3412';
    ctx.fillRect(22, -106, 15, 30);

    // やね
    ctx.fillStyle = night ? '#7f1d1d' : '#dc2626';
    ctx.beginPath();
    ctx.moveTo(-56, -54); ctx.lineTo(0, -98); ctx.lineTo(56, -54);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,20,10,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();

    // かべ
    ctx.fillStyle = night ? '#7c5a3a' : '#e0b884';
    ctx.fillRect(-44, -54, 88, 58);
    ctx.strokeStyle = 'rgba(80,45,15,0.45)';
    ctx.lineWidth = 3;
    ctx.strokeRect(-44, -54, 88, 58);

    // げんかん
    ctx.fillStyle = night ? '#5b3a1a' : '#8b5e34';
    ctx.beginPath();
    ctx.moveTo(-18, 4);
    ctx.lineTo(-18, -20);
    ctx.arc(-6, -20, 12, Math.PI, 0);
    ctx.lineTo(6, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ellipse(1, -14, 2.5, 2.5);

    // まど（よるは あかりが ともる）
    ctx.fillStyle = night ? '#fde68a' : '#bae6fd';
    if (night) { ctx.shadowBlur = 18; ctx.shadowColor = '#fde68a'; }
    ctx.fillRect(12, -44, 26, 24);
    ctx.shadowBlur = 0;

    // ねているときは まどごしに ねがおが みえる
    if (petHidden) {
        const sp = currentSpecies();
        ctx.fillStyle = sp.body;
        ellipse(25, -31, 9.5, 8.5);
        ctx.fillStyle = 'rgba(248,113,113,0.5)';
        ellipse(20, -29, 2.5, 1.8);
        ellipse(30, -29, 2.5, 1.8);
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 1.8;
        [21.5, 28.5].forEach((ex) => {
            ctx.beginPath();
            ctx.arc(ex, -33, 2.6, Math.PI * 0.15, Math.PI * 0.85);
            ctx.stroke();
        });
    }

    ctx.strokeStyle = night ? '#92400e' : '#78350f';
    ctx.lineWidth = 3;
    ctx.strokeRect(12, -44, 26, 24);
    if (!petHidden) {
        ctx.beginPath();
        ctx.moveTo(25, -44); ctx.lineTo(25, -20);
        ctx.moveTo(12, -32); ctx.lineTo(38, -32);
        ctx.stroke();
    }

    ctx.restore();

    // ねているあいだは えんとつから けむりと Zzz
    if (night) {
        const bx = W * HOUSE_X + 29 * s, by = H * 0.79 - 106 * s;
        for (let i = 0; i < 3; i++) {
            const q = (t * 0.35 + i * 0.33) % 1;
            ctx.globalAlpha = (1 - q) * 0.5;
            ctx.fillStyle = '#e2e8f0';
            ellipse(bx + Math.sin(q * 5) * 8 * s, by - q * 46 * s, (5 + q * 9) * s, (4 + q * 7) * s);
        }
        ctx.globalAlpha = 1;
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 3; i++) {
            const q = (t * 0.6 + i * 0.33) % 1;
            ctx.globalAlpha = 1 - q;
            ctx.fillText('Z', bx + 14 * s + q * 24, by - 6 * s - q * 40);
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }
}

function drawYard(t) {
    const W = cw(), H = ch(), s = W / 380;
    const night = state.sleeping;

    if (has('rainbow') && !night) {
        const cols = ['#ef4444', '#f97316', '#facc15', '#4ade80', '#38bdf8', '#a78bfa'];
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, W, H * 0.76);       // じめんより 下には えがかない
        ctx.clip();
        ctx.lineWidth = 7 * s;
        ctx.globalAlpha = 0.7;
        cols.forEach(function (c, i) {
            ctx.strokeStyle = c;
            ctx.beginPath();
            ctx.arc(W * 0.45, H * 0.86, W * 0.30 - i * 7 * s, Math.PI, Math.PI * 2);
            ctx.stroke();
        });
        ctx.restore();
    }

    if (has('tree')) {
        const x = W * 0.12, y = H * 0.80;
        ctx.fillStyle = night ? '#4a2c10' : '#78350f';
        ctx.fillRect(x - 7 * s, y - 48 * s, 14 * s, 48 * s);
        ctx.fillStyle = night ? '#14532d' : '#22c55e';
        ellipse(x, y - 66 * s, 34 * s, 27 * s);

        ctx.fillRect(wx - 7 * s, wy - 7 * s, panel, wh + 8 * s);
        ctx.fillRect(wx + ww + 7 * s - panel, wy - 7 * s, panel, wh + 8 * s);
        ctx.strokeStyle = 'rgba(0,0,0,0.13)';

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2 * s;

            ctx.lineTo(x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92);
            ctx.stroke();
        }
        const d = new Date();
        const hA = ((d.getHours() % 12) + d.getMinutes() / 60) / 12 * Math.PI * 2 - Math.PI / 2;

        ctx.beginPath();

        ctx.lineWidth = 2.5 * s;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(mA) * r * 0.74, y + Math.sin(mA) * r * 0.74);

        ctx.lineWidth = 2.5 * s;
        [0, 1].forEach(function (i) {
            const yy = y + (18 + i * 10) * s;
            ctx.beginPath();
            ctx.moveTo(x - 16 * s + i * 10 * s, yy);
            ctx.quadraticCurveTo(x - 4 * s + i * 10 * s, yy + 6 * s, x + 8 * s + i * 10 * s, yy);

    if (has('bin')) {                                       // ゴミばこ

        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 2 * s;
        [-6, 0, 6].forEach(function (q) {
            ctx.beginPath();
            ctx.moveTo(x + q * s, y - 27 * s);
            ctx.lineTo(x + q * s * 0.8, y - 4 * s);

        ctx.fillStyle = night ? '#334155' : '#475569';
        ctx.fillRect(x - 16 * s, y - 35 * s, 32 * s, 6 * s);
        ctx.fillRect(x - 3 * s, y - 39 * s, 6 * s, 5 * s);

    if (has('toilet')) {                                    // ペットトイレ
        const x = W * 0.17, y = H * 0.95;

        ctx.quadraticCurveTo(x + 14 * s, y, x, y);
        ctx.quadraticCurveTo(x - 14 * s, y, x - 19 * s, y - 15 * s);

        ctx.fillStyle = night ? '#5b3a1a' : '#b45309';

function drawRoom(t) {
    const W = cw(), H = ch();
    const night = state.sleeping;
    const wallH = H * 0.74;

    // かべ
    ctx.fillStyle = night ? '#4b3b63' : '#fdebd0';
    ctx.fillRect(0, 0, W, wallH);
    ctx.fillStyle = night ? 'rgba(255,255,255,0.05)' : 'rgba(180,120,60,0.10)';
    for (let x = 0; x < W; x += 30) ctx.fillRect(x, 0, 13, wallH);

    // はばき
    ctx.fillStyle = night ? '#3b2f4f' : '#f3d3a8';
    ctx.fillRect(0, wallH - H * 0.03, W, H * 0.03);

    // ゆか
    ctx.fillStyle = night ? '#5a4636' : '#c08b5c';
    ctx.fillRect(0, wallH, W, H - wallH);
    ctx.strokeStyle = night ? 'rgba(0,0,0,0.25)' : 'rgba(120,80,40,0.35)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(0, wallH + (H - wallH) * i / 4);
        ctx.lineTo(W, wallH + (H - wallH) * i / 4);
        ctx.stroke();
    }

    // まど（そとの けしきが みえる）
    const wx = W * 0.17, wy = H * 0.18, ww = W * 0.21, wh = H * 0.30;
    ctx.fillStyle = night ? '#16233b' : '#bae6fd';
    ctx.fillRect(wx, wy, ww, wh);
    if (night) {
        ctx.fillStyle = '#fef9c3';
        ellipse(wx + ww * 0.68, wy + wh * 0.3, ww * 0.13, ww * 0.13);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 6; i++) {
            ctx.fillRect(wx + (i * 37 % Math.round(ww)), wy + (i * 23 % Math.round(wh)), 2, 2);
        }
    } else {
        ctx.fillStyle = '#86efac';
        ctx.fillRect(wx, wy + wh * 0.72, ww, wh * 0.28);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        const cx2 = wx + ((t * 8) % (ww + 40)) - 20;
        ellipse(cx2, wy + wh * 0.3, 14, 8);
        ellipse(cx2 + 12, wy + wh * 0.3, 10, 6);
    }
    ctx.strokeStyle = night ? '#7c5a3a' : '#a16207';
    ctx.lineWidth = 5;
    ctx.strokeRect(wx, wy, ww, wh);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh);
    ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2);
    ctx.stroke();

    // かべの え
    const px = W * 0.45, py = H * 0.16, pw = W * 0.12, ph = H * 0.16;
    ctx.fillStyle = night ? '#6b5a3a' : '#d97706';
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = night ? '#3f5b63' : '#7dd3fc';
    ctx.fillRect(px + 5, py + 5, pw - 10, ph - 10);
    ctx.fillStyle = night ? '#7c6f4a' : '#fbbf24';
    ellipse(px + pw * 0.5, py + ph * 0.42, pw * 0.16, pw * 0.16);
    ctx.fillStyle = night ? '#4b5b46' : '#86efac';
    ctx.fillRect(px + 5, py + ph * 0.62, pw - 10, ph * 0.32 - 5);

    // てんじょうの ランプ
    const lx = W * 0.68;
    ctx.strokeStyle = night ? '#57534e' : '#78716c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lx, 0); ctx.lineTo(lx, H * 0.10);
    ctx.stroke();
    if (night) {
        const g = ctx.createRadialGradient(lx, H * 0.13, 4, lx, H * 0.13, H * 0.42);
        g.addColorStop(0, 'rgba(253,230,138,0.55)');
        g.addColorStop(1, 'rgba(253,230,138,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(lx, H * 0.13, H * 0.42, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = night ? '#fde68a' : '#e7e5e4';
    ctx.beginPath();
    ctx.moveTo(lx - 22, H * 0.14); ctx.lineTo(lx + 22, H * 0.14);
    ctx.lineTo(lx + 11, H * 0.09); ctx.lineTo(lx - 11, H * 0.09);
    ctx.closePath();
    ctx.fill();

    // ラグ
    ctx.fillStyle = night ? '#4a3f63' : '#fca5a5';
    ellipse(W * IN_X, H * 0.90, W * 0.20, H * 0.055);
    ctx.fillStyle = night ? '#584a73' : '#fecdd3';
    ellipse(W * IN_X, H * 0.90, W * 0.13, H * 0.035);

    drawRoomStuff(t);
}

function drawPoops() {
    const W = cw(), H = ch();
    const s = W / 380;
    const inTray = !isOutside() && has('toilet');    // トイレが あれば その中に たまる
    ctx.save();
    ctx.fillStyle = '#78350f';
    state.poops.forEach((p, i) => {
        const k = (inTray ? 0.7 : 1) * s;
        const x = inTray ? W * 0.17 + (i - (state.poops.length - 1) / 2) * 10 * s : p.x * W;
        const y = inTray ? H * 0.95 - 10 * s : H * 0.86;
        ellipse(x, y, 12 * k, 6 * k);
        ellipse(x, y - 6 * k, 9 * k, 5 * k);
        ellipse(x, y - 11 * k, 5 * k, 4 * k);
    });
    ctx.restore();
}

function drawEgg(t) {
    const W = cw(), H = ch();
    const shake = action.type === 'shake' ? Math.sin(t * 40) * 0.12 : Math.sin(t * 1.6) * 0.04;
    ctx.save();
    ctx.translate(W / 2, H * 0.66);
    ctx.rotate(shake);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ellipse(0, 46, 40, 9);
    ctx.fillStyle = '#fffbeb';
    ellipse(0, 0, 42, 52);
    ctx.strokeStyle = 'rgba(120,53,15,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, 42, 52, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#fbcfe8';
    ellipse(-14, -8, 9, 7);
    ellipse(12, 10, 11, 8);
    ellipse(6, -24, 6, 5);
    if (state.tap >= 4) {
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-22, -12); ctx.lineTo(-8, -2); ctx.lineTo(2, -16); ctx.lineTo(16, -4);
        ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('タップして あたためよう！ (' + state.tap + '/8)', W / 2, H * 0.94);
    ctx.textAlign = 'left';
}

function drawEyes(m, t) {
    const blink = (Math.sin(t * 1.3) > 0.985);
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    if (m === 'sleep' || blink) {
        [-16, 16].forEach((x) => {
            ctx.beginPath();
            ctx.arc(x, -8, 7, Math.PI * 0.15, Math.PI * 0.85);
            ctx.stroke();
        });
        return;
    }
    if (m === 'joy') {
        [-16, 16].forEach((x) => {
            ctx.beginPath();
            ctx.arc(x, -4, 7, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
        });
        return;
    }
    if (m === 'sick') {
        [-16, 16].forEach((x) => {
            ctx.beginPath();
            ctx.moveTo(x - 6, -12); ctx.lineTo(x + 6, -3);
            ctx.moveTo(x + 6, -12); ctx.lineTo(x - 6, -3);
            ctx.stroke();
        });
        return;
    }
    [-16, 16].forEach((x) => {
        ctx.fillStyle = '#1f2937';
        ellipse(x, -8, 6, m === 'sad' ? 5 : 7);
        ctx.fillStyle = '#fff';
        ellipse(x + 2, -10, 2.2, 2.2);
    });
    if (m === 'sad') {
        ctx.fillStyle = '#38bdf8';
        ellipse(-22, 0, 3, 5);
    }
}

function drawMouth(m, t) {
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    if (m === 'eat') {
        ctx.fillStyle = '#be123c';
        ellipse(0, 10, 9, 7 + Math.sin(t * 18) * 3);
        return;
    }
    if (m === 'sad' || m === 'sick') {
        ctx.beginPath();
        ctx.arc(0, 16, 8, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        return;
    }
    if (m === 'sleep') {
        ctx.beginPath();
        ctx.arc(0, 8, 4, 0, Math.PI);
        ctx.stroke();
        return;
    }
    ctx.beginPath();
    ctx.arc(0, 6, m === 'joy' ? 11 : 8, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
}

function drawEars(sp) {
    ctx.fillStyle = sp.accent;
    if (sp.ear === 'round') {
        ellipse(-34, -34, 13, 13);
        ellipse(34, -34, 13, 13);
    } else if (sp.ear === 'long') {
        ctx.save();
        ctx.rotate(-0.25); ellipse(-24, -48, 9, 22); ctx.restore();
        ctx.save();
        ctx.rotate(0.25); ellipse(24, -48, 9, 22); ctx.restore();
    } else if (sp.ear === 'horn') {
        [-26, 26].forEach((x) => {
            ctx.beginPath();
            ctx.moveTo(x - 10, -34);
            ctx.lineTo(x, -60);
            ctx.lineTo(x + 10, -34);
            ctx.closePath();
            ctx.fill();
        });
    } else if (sp.ear === 'star') {
        ctx.strokeStyle = sp.accent;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, -60); ctx.stroke();
        ctx.fillStyle = '#facc15';
        star(0, -66, 5, 10, 5);
    }
}

function star(x, y, spikes, outer, inner) {
    let rot = -Math.PI / 2;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(x, y - outer);
    for (let i = 0; i < spikes; i++) {
        ctx.lineTo(x + Math.cos(rot) * outer, y + Math.sin(rot) * outer);
        rot += step;
        ctx.lineTo(x + Math.cos(rot) * inner, y + Math.sin(rot) * inner);
        rot += step;
    }
    ctx.closePath();
    ctx.fill();
}

function drawAccessory(sp) {
    if (sp.acc === 'crown') {
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(-20, -44);
        ctx.lineTo(-20, -62); ctx.lineTo(-8, -52); ctx.lineTo(0, -66);
        ctx.lineTo(8, -52); ctx.lineTo(20, -62); ctx.lineTo(20, -44);
        ctx.closePath();
        ctx.fill();
    } else if (sp.acc === 'band') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-40, -34, 80, 10);
        ctx.fillStyle = '#fff';
        ellipse(0, -29, 4, 4);
    } else if (sp.acc === 'bib') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(-22, 12); ctx.lineTo(22, 12); ctx.lineTo(14, 44); ctx.lineTo(-14, 44);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ef4444';
        ellipse(0, 26, 6, 6);
    }
}

function drawCreature(t) {
    const W = cw(), H = ch();
    const sp = currentSpecies();
    const m = mood();
    const s = petScale() * (W / 380);
    let bob = Math.sin(t * 2.4) * 4;
    if (m === 'joy') bob = Math.abs(Math.sin(t * 6)) * -14;
    if (m === 'train') bob = Math.abs(Math.sin(t * 9)) * -10;
    if (m === 'sad' || m === 'sick') bob = Math.sin(t * 1.2) * 2;

    const baseY = H * 0.70 - (inBed ? 26 * s : 0);
    const cx = petPos * W;

    if (action.type !== 'bath') {
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.16)';
        ctx.beginPath();
        ctx.ellipse(cx, baseY + 52 * s, 44 * s, 10 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.save();
    ctx.translate(cx, baseY + bob * s);
    ctx.scale(s, s);

    drawEars(sp);

    // 足
    ctx.fillStyle = sp.accent;
    ellipse(-22, 46, 15, 9);
    ellipse(22, 46, 15, 9);

    // 手
    const arm = m === 'joy' ? -18 : (m === 'train' ? -22 + Math.sin(t * 9) * 10 : (m === 'eat' ? -4 : 6));
    ctx.fillStyle = sp.accent;
    ellipse(-44, 12 + arm, 11, 11);
    ellipse(44, 12 + arm, 11, 11);

    // からだ
    ctx.fillStyle = sp.body;
    ellipse(0, 6, 44, 44);
    ctx.strokeStyle = 'rgba(31,41,55,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 6, 44, 44, 0, 0, Math.PI * 2);
    ctx.stroke();

    // おなか
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ellipse(0, 18, 26, 24);

    drawAccessory(sp);

    // ほっぺ
    if (m !== 'sick' && m !== 'sad') {
        ctx.fillStyle = 'rgba(248,113,113,0.55)';
        ellipse(-28, 4, 8, 5);
        ellipse(28, 4, 8, 5);
    }

    drawEyes(m, t);
    drawMouth(m, t);

    if (state.wearing === 'hat') {                       // むぎわらぼうし
        ctx.fillStyle = '#fcd34d';
        ellipse(0, -38, 54, 13);
        ctx.fillStyle = '#fbbf24';
        ellipse(0, -50, 26, 17);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-26, -47, 52, 7);
    } else if (state.wearing === 'ribbon') {             // リボン
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.moveTo(-30, -34); ctx.lineTo(-50, -45); ctx.lineTo(-50, -23);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-30, -34); ctx.lineTo(-10, -45); ctx.lineTo(-10, -23);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ec4899';
        ellipse(-30, -34, 6, 6);
    } else if (state.wearing === 'glasses') {            // めがね
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ellipse(-16, -8, 13, 13);
        ellipse(16, -8, 13, 13);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-16, -8, 13, 0, Math.PI * 2);
        ctx.moveTo(29, -8);
        ctx.arc(16, -8, 13, 0, Math.PI * 2);
        ctx.moveTo(-3, -10); ctx.lineTo(3, -10);
        ctx.moveTo(-29, -11); ctx.lineTo(-42, -15);
        ctx.moveTo(29, -11); ctx.lineTo(42, -15);
        ctx.stroke();
    }

    // よごれ
    if (state.clean < 40) {
        ctx.fillStyle = 'rgba(120,53,15,0.45)';
        ellipse(-18, 30, 6, 4);
        ellipse(14, 36, 5, 3);
        if (state.clean < 20) ellipse(24, 18, 5, 4);
    }
    ctx.restore();

    // 状態アイコン
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    if (state.sick) {
        ctx.fillStyle = '#16a34a';
        ctx.fillText('🤒', cx + 46 * s, baseY - 44 * s);
    }
    if (!state.sleeping && !state.sick && state.hunger < 25) {
        ctx.fillText('🍖', cx - 52 * s, baseY - 44 * s + Math.sin(t * 3) * 4);
    }
    ctx.textAlign = 'left';
}

/* ---------------- action scenes ---------------- */

// ペットと おなじ ざひょうけいを つかう
function stageInfo() {
    const W = cw(), H = ch();
    return { W: W, H: H, s: petScale() * (W / 380), cx: petPos * W, baseY: H * 0.70 };
}

function drawFoodItem(key) {
    if (key === 'feast') {
        ctx.fillStyle = '#fde68a';                       // ほね
        ctx.fillRect(-26, -6, 52, 7);
        ctx.beginPath();
        ctx.arc(-26, -2.5, 6, 0, Math.PI * 2);
        ctx.arc(26, -2.5, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#b45309';                       // おにく
        ellipse(0, -9, 21, 13);
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, -9, 21, 13, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#92400e';
        ellipse(-6, -13, 8, 4);
    } else if (key === 'cake') {
        ctx.fillStyle = '#fef3c7';                       // スポンジ
        ctx.beginPath();
        ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(11, -26); ctx.lineTo(-11, -26);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fbcfe8';                       // クリーム
        ctx.fillRect(-15, -15, 30, 6);
        ctx.beginPath();
        ctx.moveTo(-11, -26); ctx.lineTo(11, -26); ctx.lineTo(12, -31); ctx.lineTo(-12, -31);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#ef4444';                       // いちご
        ellipse(0, -35, 6, 6);
    } else {
        ctx.fillStyle = '#fff';                          // ごはん
        ellipse(0, -14, 17, 11);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, -14, 17, 11, 0, Math.PI, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#dc2626';                       // おちゃわん
        ctx.beginPath();
        ctx.moveTo(-23, -10);
        ctx.lineTo(23, -10);
        ctx.quadraticCurveTo(19, 9, 0, 9);
        ctx.quadraticCurveTo(-19, 9, -23, -10);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fca5a5';
        ctx.fillRect(-23, -11, 46, 3);
        ctx.fillStyle = '#b91c1c';                       // だい
        ctx.fillRect(-7, 7, 14, 4);
    }
}

function drawFoodScene(t) {
    const st = stageInfo();
    const left = 1 - Math.floor(actionProgress() * 3) / 3;   // 3くちで たべおわる
    if (left <= 0) return;
    ctx.save();
    ctx.translate(st.cx - 76 * st.s, st.baseY + 12 * st.s + Math.sin(t * 9) * 2.5 * st.s);
    ctx.scale(st.s * 1.2, st.s * 1.2);
    ctx.scale(left, left);
    drawFoodItem(action.food);
    ctx.restore();
}

function drawTubBack(t) {
    const st = stageInfo();
    ctx.save();
    ctx.translate(st.cx, st.baseY);
    ctx.scale(st.s, st.s);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ellipse(0, 64, 78, 10);
    ctx.fillStyle = '#e0f2fe';                               // タブ
    ctx.fillRect(-74, 24, 148, 34);
    ellipse(0, 58, 74, 12);
    ctx.fillStyle = '#bae6fd';                               // ふちの うちがわ
    ellipse(0, 24, 74, 17);
    ctx.restore();
}

function drawTubFront(t) {
    const st = stageInfo();
    ctx.save();
    ctx.translate(st.cx, st.baseY);
    ctx.scale(st.s, st.s);

    const wave = Math.sin(t * 3) * 1.5;
    ctx.fillStyle = 'rgba(56,189,248,0.95)';                 // おゆ
    ellipse(0, 30 + wave, 68, 14);

    ctx.fillStyle = '#e0f2fe';                               // タブの まえがわ
    ctx.beginPath();
    ctx.ellipse(0, 30, 74, 17, 0, 0, Math.PI);
    ctx.rect(-74, 30, 148, 30);
    ctx.fill();
    ctx.fillStyle = '#f0f9ff';
    ctx.beginPath();
    ctx.ellipse(0, 58, 74, 12, 0, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = '#7dd3fc';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 30, 74, 17, 0, 0, Math.PI);
    ctx.stroke();

    ctx.fillStyle = '#fff';                                  // あわ（おゆの ふち）
    for (let i = 0; i < 9; i++) {
        const a = i / 8 * Math.PI;
        ctx.globalAlpha = 0.9;
        ellipse(-66 + i * 16.5, 30 + wave + Math.sin(t * 4 + i) * 2, 9 + (i % 3) * 2, 7);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#fff';                                  // あたまの あわ
    ellipse(-12, -46, 12, 9);
    ellipse(4, -52, 14, 10);
    ellipse(16, -44, 10, 8);

    // アヒル
    ctx.fillStyle = '#facc15';
    ellipse(48, 22 + wave, 13, 9);
    ellipse(56, 12 + wave, 8, 8);
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.moveTo(62, 11 + wave); ctx.lineTo(72, 14 + wave); ctx.lineTo(62, 16 + wave);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1f2937';
    ellipse(58, 10 + wave, 1.6, 1.6);
    ctx.restore();

    // ゆげ
    ctx.save();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4.5 * st.s;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
        const q = (t * 0.5 + i * 0.33) % 1;
        ctx.globalAlpha = (1 - q) * 0.9;
        const x = st.cx + (-40 + i * 40) * st.s;
        const y = st.baseY + (10 - q * 70) * st.s;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + 10 * st.s, y - 10 * st.s, x, y - 20 * st.s);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
}

function drawWorkScene(t) {
    const st = stageInfo();
    const arm = 12 + (-22 + Math.sin(t * 9) * 10);
    const id = action.food;
    ctx.save();
    ctx.translate(st.cx, st.baseY);
    ctx.scale(st.s, st.s);
    if (id === 'carry') {                                  // にもつ
        ctx.fillStyle = '#d6a15b';
        ctx.fillRect(-30, arm - 56, 60, 38);
        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 3;
        ctx.strokeRect(-30, arm - 56, 60, 38);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-30, arm - 42, 60, 7);
    } else if (id === 'weed') {                            // くさ
        ctx.strokeStyle = '#16a34a';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        [[-64, -16], [-56, -24], [-48, -14]].forEach(function (g) {
            ctx.beginPath();
            ctx.moveTo(-52, arm);
            ctx.quadraticCurveTo(g[0], arm + g[1], g[0] - 3, arm + g[1] * 1.7);
            ctx.stroke();
        });
        ctx.fillStyle = '#22c55e';
        ellipse(66, 44, 17, 7);
        ellipse(60, 38, 10, 5);
    } else {                                               // おみせばんの コイン
        ctx.fillStyle = '#facc15';
        ellipse(54, arm, 14, 14);
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(54, arm, 14, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#a16207';
        ctx.fillRect(47, arm - 2, 14, 3.5);
        ctx.fillRect(52, arm - 9, 4, 18);
    }
    ctx.restore();
}

function drawDumbbell(t) {
    const st = stageInfo();
    const y = 12 + (-22 + Math.sin(t * 9) * 10);
    ctx.save();
    ctx.translate(st.cx, st.baseY);
    ctx.scale(st.s, st.s);
    [-52, 52].forEach((x) => {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(x - 12, y - 2.5, 24, 5);
        ctx.fillStyle = '#334155';
        ctx.fillRect(x - 16, y - 10, 8, 20);
        ctx.fillRect(x + 8, y - 10, 8, 20);
    });
    ctx.restore();
}

function drawBall(t) {
    const st = stageInfo();
    const hop = Math.abs(Math.sin(t * 5));
    const gx = st.cx + 58 * st.s, gy = st.baseY + 48 * st.s;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath();
    ctx.ellipse(gx, gy, (12 - hop * 4) * st.s, (4 - hop * 1.5) * st.s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(gx, gy - 13 * st.s - hop * 54 * st.s);
    ctx.scale(st.s, st.s);
    ctx.fillStyle = '#f8fafc';
    ellipse(0, 0, 13, 13);
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-13, 1);
    ctx.quadraticCurveTo(0, -7, 13, 1);
    ctx.stroke();
    ctx.restore();
}

function drawParticles(dt, t) {
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    particles = particles.filter((p) => {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 30 * dt;
        if (p.life <= 0) return false;
        ctx.globalAlpha = clamp(p.life, 0, 1);
        const icon = p.type === 'heart' ? '💛' : p.type === 'star' ? '⭐' :
                     p.type === 'bubble' ? '🫧' : '💦';
        ctx.fillText(icon, p.x, p.y);
        ctx.globalAlpha = 1;
        return true;
    });
    ctx.textAlign = 'left';
}

/* ---------------- UI ---------------- */

function setBar(id, numId, value) {
    el(id).style.width = clamp(value, 0, 100) + '%';
    if (numId) el(numId).textContent = Math.round(value);
}

function updateUI() {
    el('pet-name').textContent = state.stage === 'egg' ? 'たまご' : state.name;
    el('coin-view').textContent = '🪙 ' + state.coins;
    el('stage-view').textContent = state.stage === 'egg' ? 'たまご' : currentSpecies().name;
    el('age-view').textContent = Math.floor(state.ageSec / DAY_SEC) + '日目';
    el('power-view').textContent = 'ちから ' + state.power;

    setBar('hunger-bar', 'hunger-num', state.hunger);
    setBar('happy-bar', 'happy-num', state.happy);
    setBar('clean-bar', 'clean-num', state.clean);
    setBar('energy-bar', 'energy-num', state.energy);
    setBar('hp-bar', 'hp-num', state.hp);
    setBar('exp-bar', null, state.exp / expNeeded(state.level) * 100);
    el('level-num').textContent = state.level;

    el('btn-sleep').textContent = state.sleeping ? '☀ おこす' : '💤 ねる';
    el('btn-view-out').classList.toggle('view-off', !isOutside());
    el('btn-view-in').classList.toggle('view-off', isOutside());

    const locked = state.stage === 'egg' || state.sleeping;
    ['btn-feed', 'btn-play', 'btn-train', 'btn-job', 'btn-bath', 'btn-clean', 'btn-med'].forEach((id) => {
        el(id).classList.toggle('disabled', locked);
    });
    el('btn-med').classList.toggle('disabled', locked || !state.sick);
}

/* ---------------- main loop ---------------- */

function frame(ts) {
    const t = ts / 1000;
    let dt = lastFrame ? t - lastFrame : 0;
    lastFrame = t;
    dt = clamp(dt, 0, 0.5);

    if (action.type && now() > action.until) action.type = null;

    applyTime(dt);

    if (mini.active) {
        mini.pos += mini.dir * mini.speed * dt;
        if (mini.pos >= 1) { mini.pos = 1; mini.dir = -1; }
        if (mini.pos <= 0) { mini.pos = 0; mini.dir = 1; }
        const marker = el('mini-marker');
        if (marker) marker.style.left = (mini.pos * 100) + '%';
    }

    // ねるときは げんかん（そと）／ベッド（なか）まで あるいて いく
    const outside = isOutside();
    petPos += (petTarget() - petPos) * Math.min(1, dt * 3.5);
    petHidden = outside && state.sleeping && Math.abs(petPos - DOOR_X) < 0.012;
    inBed = !outside && state.sleeping && Math.abs(petPos - BED_X) < 0.02;

    if (outside) {
        drawBackground(t);
        drawYard(t);
        drawHouse(t);
        drawPost(t);
    } else {
        drawRoom(t);
        drawBedBack(t);
    }
    if (state.stage === 'egg') {
        drawEgg(t);
    } else {
        drawPoops();
        if (!petHidden) {
            if (action.type === 'bath') drawTubBack(t);
            drawCreature(t);
            if (inBed) drawBlanket(t);
            if (action.type === 'bath') drawTubFront(t);
            else if (action.type === 'eat') drawFoodScene(t);
            else if (action.type === 'train') drawDumbbell(t);
            else if (action.type === 'work') drawWorkScene(t);
            else if (action.type === 'play') drawBall(t);
        }
    }
    drawParticles(dt, t);
    updateUI();

    saveTimer += dt;
    if (saveTimer > 5) { saveTimer = 0; save(); }

    requestAnimationFrame(frame);
}

function init() {
    canvas = el('stage');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    const loaded = load();
    if (loaded) {
        state = loaded;
        const away = clamp(now() - state.lastTick, 0, OFFLINE_CAP);
        if (away > 60) {
            applyTime(away);
            addLog(`（${Math.floor(away / 60)}分ぶん じかんが すすんだ）`);
            if (!state.exhausted && (state.hp < 40 || state.sick)) {
                addLog(`${state.name} が ぐったりしている… はやく おせわしよう！`);
            }
        }
    } else {
        state = newState();
    }

    petPos = petTarget();
    petHidden = isOutside() && state.sleeping;
    inBed = !isOutside() && state.sleeping;

    canvas.addEventListener('click', tapCanvas);
    el('modal-back').addEventListener('click', (e) => {
        if (e.target === el('modal-back') && el('modal-back').dataset.closable !== '0') hideModal();
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    window.addEventListener('beforeunload', save);

    renderLog();
    updateUI();
    requestAnimationFrame(frame);
}

window.addEventListener('load', init);
</script>
</body>
</html>
