<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ファンタジー・バトルアクション</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* タップ時のハイライトを無効化 */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #111827;
            touch-action: none;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen overflow-hidden text-white font-sans p-2">

    <!-- ゲームコンテナ -->
    <div class="relative w-full max-w-4xl bg-gray-900 border-4 border-gray-700 rounded-lg shadow-2xl overflow-hidden flex flex-col">
        
        <!-- ヘッダーUI -->
        <div class="flex justify-between items-center bg-gray-800 px-4 py-2 border-b-2 border-gray-700 z-10 text-sm sm:text-base">
            <div class="flex items-center space-x-4">
                <div>
                    <span class="text-yellow-400 font-bold"><i class="fa-solid fa-crown mr-1"></i>スコア:</span>
                    <span id="score-val" class="font-mono text-lg">0</span>
                </div>
                <div>
                    <span class="text-blue-400 font-bold"><i class="fa-solid fa-angle-up mr-1"></i>Lv:</span>
                    <span id="level-val" class="font-mono text-lg">1</span>
                </div>
            </div>
            <div class="text-center font-bold text-red-500 animate-pulse hidden" id="boss-warning">
                ⚠️ ボス出現中！ ⚠️
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-sound" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-xs">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button id="btn-pause" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-xs">
                    一時停止
                </button>
            </div>
        </div>

        <!-- ゲーム画面エリア -->
        <div class="relative flex-grow flex items-center justify-center bg-slate-950" style="height: 60vh; max-height: 450px;">
            <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

            <!-- スタート・ゲームオーバー・クリア画面のオーバーレイ -->
            <div id="overlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center text-center p-6 z-20">
                <!-- タイトル画面 -->
                <div id="menu-start" class="space-y-6">
                    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-wider text-red-500 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">
                        BLADE DESTROYER
                    </h1>
                    <p class="text-gray-300 text-sm sm:text-base max-w-md mx-auto text-yellow-400 font-bold">
                        ★超・爆裂スクロールぶっ飛びノックバック！★<br>
                        大剣の重撃を当てて、世界ごと敵を後ろへ吹っ飛ばせ！
                    </p>
                    
                    <!-- 操作説明 -->
                    <div class="bg-gray-800/80 p-3 rounded-lg border border-gray-700 max-w-xs mx-auto space-y-1 text-xs text-gray-300">
                        <p class="text-yellow-400 font-bold mb-1">🎮 操作方法 🎮</p>
                        <p><kbd class="px-1.5 py-0.5 bg-gray-900 rounded">←</kbd> <kbd class="px-1.5 py-0.5 bg-gray-900 rounded">→</kbd> または画面ボタン：移動</p>
                        <p><kbd class="px-1.5 py-0.5 bg-gray-900 rounded">スペース</kbd> または <kbd class="px-1.5 py-0.5 bg-gray-900 rounded">X</kbd>：<span class="text-red-400 font-bold">超・連続攻撃！</span></p>
                        <p><kbd class="px-1.5 py-0.5 bg-gray-900 rounded">↑</kbd> または <kbd class="px-1.5 py-0.5 bg-gray-900 rounded">Z</kbd>：ジャンプ</p>
                        <p class="text-red-400 font-bold text-[10px] mt-1">※動かない時は、まず画面を1回クリックしてね！</p>
                    </div>

                    <button id="btn-start" class="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-lg rounded-full transform hover:scale-105 transition shadow-lg shadow-red-900/50">
                        ゲーム開始
                    </button>
                </div>

                <!-- ゲームオーバー画面 -->
                <div id="menu-gameover" class="hidden space-y-6">
                    <h2 class="text-5xl font-extrabold text-red-600 animate-bounce">GAME OVER</h2>
                    <p class="text-gray-300">あなたは力尽きてしまった...</p>
                    <div class="bg-gray-900/80 p-4 rounded-lg inline-block border border-red-900">
                        <p class="text-sm text-gray-400">最終スコア</p>
                        <p id="final-score" class="text-3xl font-bold text-yellow-400">0</p>
                        <p class="text-xs text-gray-400 mt-2">到達レベル: <span id="final-level" class="text-blue-400">1</span></p>
                    </div>
                    <br>
                    <button id="btn-restart" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-full transform hover:scale-105 transition shadow-lg">
                        もう一度挑戦

                </div>

                <!-- ゲームクリア画面 -->
                <div id="menu-clear" class="hidden space-y-6">
                    <h2 class="text-5xl font-extrabold text-yellow-400 animate-pulse">VICTORY!</h2>
                    <p class="text-green-400 font-bold">強敵をすべて撃破し、世界に平和が戻った！</p>
                    <div class="bg-gray-900/80 p-4 rounded-lg inline-block border border-yellow-600">
                        <p class="text-sm text-gray-400">ハイスコア</p>
                        <p id="clear-score" class="text-3xl font-bold text-yellow-400">0</p>
                    </div>
                    <br>
                    <button id="btn-clear-restart" class="px-8 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-extrabold text-lg rounded-full transform hover:scale-105 transition shadow-lg">
                        もう一度遊ぶ
                    </button>
                </div>

                <!-- 一時停止画面 -->
                <div id="menu-pause" class="hidden space-y-4">
                    <h2 class="text-3xl font-bold text-gray-300">PAUSE</h2>
                    <p class="text-gray-400">ゲームは一時停止しています</p>
                    <button id="btn-resume" class="px-6 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded">
                        再開する
                    </button>
                </div>
            </div>

            <!-- ダメージ赤枠エフェクト -->
            <div id="damage-flash" class="absolute inset-0 bg-red-600/30 pointer-events-none opacity-0 transition-opacity duration-75"></div>
        </div>

        <!-- 画面内操作パネル -->
        <div class="bg-gray-900 p-4 border-t-2 border-gray-700 select-none">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <!-- 이동キー（左・右） -->
                <div class="flex space-x-3">
                    <button id="ctrl-left" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 active:bg-gray-500 rounded-2xl flex items-center justify-center text-2xl border-b-4 border-gray-900 shadow-md">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="ctrl-right" class="w-14 h-14 sm:w-16 sm:h-16 bg-gray-700 active:bg-gray-500 rounded-2xl flex items-center justify-center text-2xl border-b-4 border-gray-900 shadow-md">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <!-- アクションキー（攻撃・ジャンプ） -->
                <div class="flex space-x-3">
                    <!-- ジャンプ -->
                    <button id="ctrl-jump" class="w-14 h-14 sm:w-16 sm:h-16 bg-blue-700 active:bg-blue-500 rounded-full flex flex-col items-center justify-center text-sm border-b-4 border-blue-900 shadow-md">
                        <i class="fa-solid fa-arrow-up text-xl mb-0.5"></i>
                        <span class="text-[10px] font-bold">JUMP</span>
                    </button>
                    <!-- 攻撃 -->
                    <button id="ctrl-attack" class="w-16 h-16 sm:w-20 sm:h-20 bg-red-600 active:bg-red-400 rounded-full flex flex-col items-center justify-center text-sm border-b-4 border-red-800 shadow-lg transform -translate-y-2">
                        <i class="fa-solid fa-hand-fist text-2xl mb-1"></i>
                        <span class="text-xs font-bold">ATTACK</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 音響効果用Web Audio API 簡易シンセサイザー -->
    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'swing') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'damage') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'levelup') {
                osc.type = 'sine';
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, index) => {
                    const t = now + index * 0.08;
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, t);
                    g.gain.setValueAtTime(0.2, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(t);
                    o.stop(t + 0.22);
                });
            } else if (type === 'boss_spawn') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        const soundBtn = document.getElementById('btn-sound');
        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            } else {
                soundBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            }
        });
    </script>

    <!-- メインゲームロジック -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const BASE_WIDTH = 800;
        const BASE_HEIGHT = 400;
        canvas.width = BASE_WIDTH;
        canvas.height = BASE_HEIGHT;

        let gameState = 'START';
        let score = 0;
        let level = 1;
        let exp = 0;
        let nextLevelExp = 100;
        let bossSpawned = false;
        
        let screenShake = 0;
        let hitStopTimer = 0;

        const keys = {};

        const touchInputs = {
            left: false,
            right: false,
            jump: false,
            attack: false
        };

        // ----------------------------------------------------
        // クラス定義
        // ----------------------------------------------------

        class Player {
            constructor() {
                this.width = 40;
                this.height = 64;
                this.x = 100;
                this.y = BASE_HEIGHT - this.height - 40;
                this.vx = 0;
                this.vy = 0;
                this.speed = 5.5;
                this.jumpPower = 13;
                this.gravity = 0.6;
                this.isGrounded = false;
                
                this.maxHp = 100;
                this.hp = 100;
                this.attackPower = 20;
                
                this.direction = 1;
                this.isAttacking = false;
                this.attackCooldown = 0;
                this.attackRange = 110; 
                this.attackDuration = 12; 
                this.attackTimer = 0;
                this.invulnerableFrames = 0;

                this.animTimer = 0;
                this.isWalking = false;
            }

            update() {
                if (this.invulnerableFrames > 0) {
                    this.invulnerableFrames--;
                }

                const goLeft = keys['ArrowLeft'] || touchInputs.left;
                const goRight = keys['ArrowRight'] || touchInputs.right;

                if (goLeft) {
                    this.vx = -this.speed;
                    this.direction = -1;
                    this.isWalking = true;
                } else if (goRight) {
                    this.vx = this.speed;
                    this.direction = 1;
                    this.isWalking = true;
                } else {
                    this.vx = 0;
                    this.isWalking = false;
                }

                const doJump = keys['ArrowUp'] || keys['z'] || keys['Z'] || keys['KeyZ'] || touchInputs.jump;
                if (doJump && this.isGrounded) {
                    this.vy = -this.jumpPower;
                    this.isGrounded = false;
                    playSound('jump');
                }

                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = 0;
                if (this.x > BASE_WIDTH - this.width) this.x = BASE_WIDTH - this.width;

                const groundY = BASE_HEIGHT - this.height - 40;
                if (this.y >= groundY) {
                    this.y = groundY;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                // 攻撃ボタンの検知
                const doAttack = keys[' '] || keys['Space'] || keys['x'] || keys['X'] || keys['KeyX'] || touchInputs.attack;
                if (doAttack && this.attackCooldown === 0) {
                    this.performAttack();
                }

                if (this.attackCooldown > 0) {
                    this.attackCooldown--;
                }

                if (this.isAttacking) {
                    this.attackTimer--;
                    if (this.attackTimer <= 0) {
                        this.isAttacking = false;
                    }
                }

                this.animTimer++;
            }

            performAttack() {
                this.isAttacking = true;
                this.attackTimer = this.attackDuration;
                this.attackCooldown = 8; 
                playSound('swing');
                spawnAttackSlash(this);
            }

            draw() {
                ctx.save();

                if (this.isAttacking) {
                    ctx.shadowColor = '#60a5fa';
                    ctx.shadowBlur = 15;
                } else if (this.invulnerableFrames > 0 && Math.floor(this.invulnerableFrames / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.3;
                }

                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.scale(this.direction, 1);

                const w = this.width;
                const h = this.height;

                let bob = 0;
                if (this.isWalking && this.isGrounded) {
                    bob = Math.sin(this.animTimer * 0.2) * 3;
                }

                // 1. 体/鎧
                ctx.fillStyle = '#1e40af';
                ctx.fillRect(-w/2 + 4, -h/2 + 16 + bob, w - 8, 30);
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(-w/2 + 8, -h/2 + 20 + bob, w - 16, 22);

                // 2. 頭/兜
                ctx.fillStyle = '#9ca3af';
                ctx.fillRect(-w/2 + 6, -h/2 + bob, w - 12, 18);
                ctx.fillStyle = '#d1d5db';
                ctx.fillRect(-w/2 + 10, -h/2 + 4 + bob, w - 20, 10);
                
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(2, -h/2 + 8 + bob, 6, 3);

                // 3. 剣の描画
                if (this.isAttacking) {
                    ctx.fillStyle = '#f3f4f6';
                    ctx.fillRect(10, -h/2 + 16 + bob, 45, 10); 
                    ctx.fillStyle = '#d97706'; 
                    ctx.fillRect(6, -h/2 + 12 + bob, 4, 18);
                } else {
                    ctx.fillStyle = '#f3f4f6';
                    ctx.fillRect(-w/2 - 2, -h/2 + bob, 6, 24);
                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(-w/2 - 4, -h/2 + 24 + bob, 10, 4);
                }

                // 4. 足
                ctx.fillStyle = '#1e293b';
                let legOffsetL = 0;
                let legOffsetR = 0;
                if (this.isWalking && this.isGrounded) {
                    legOffsetL = Math.sin(this.animTimer * 0.2) * 6;
                    legOffsetR = -Math.sin(this.animTimer * 0.2) * 6;
                }
                ctx.fillRect(-w/2 + 6, h/2 - 18 + legOffsetL, 8, 18);
                ctx.fillRect(w/2 - 14, h/2 - 18 + legOffsetR, 8, 18);

                ctx.restore();

                // 頭上の体力ゲージ
                const barWidth = 50;
                const barHeight = 6;
                const barX = this.x + (this.width - barWidth) / 2;
                const barY = this.y - 12;

                ctx.fillStyle = '#ef4444';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                ctx.fillStyle = '#22c55e';
                const currentHpWidth = (this.hp / this.maxHp) * barWidth;
                ctx.fillRect(barX, barY, currentHpWidth > 0 ? currentHpWidth : 0, barHeight);
            }

            takeDamage(amount, fromX) {
                if (this.isAttacking || this.invulnerableFrames > 0) return;
                
                this.hp -= amount;
                this.invulnerableFrames = 45;
                playSound('damage');

                const flash = document.getElementById('damage-flash');
                flash.classList.remove('opacity-0');
                flash.classList.add('opacity-100');
                setTimeout(() => {
                    flash.classList.remove('opacity-100');
                    flash.classList.add('opacity-0');
                }, 100);

                const kbDir = this.x + this.width / 2 > fromX ? 1 : -1;
                this.vx = kbDir * 8;
                this.vy = -5;
                this.isGrounded = false;

                if (this.hp <= 0) {
                    this.hp = 0;
                    gameOver();
                }
            }

            gainExp(amount) {
                exp += amount;
                if (exp >= nextLevelExp) {
                    exp -= nextLevelExp;
                    level++;
                    nextLevelExp = Math.floor(nextLevelExp * 1.5);
                    
                    this.maxHp += 20;
                    this.hp = this.maxHp;
                    this.attackPower += 5;
                    this.speed += 0.2;
                    
                    playSound('levelup');
                    spawnLevelUpEffect(this);
                    updateUI();
                }
            }
        }

        // 敵モンスタークラス
        class Enemy {
            constructor(type) {
                this.type = type;
                this.width = 40;
                this.height = 40;
                
                this.x = BASE_WIDTH + 50;
                this.y = BASE_HEIGHT - this.height - 40;
                
                this.vx = -1.5;
                this.vy = 0;
                this.direction = -1;

                this.color = '#10b981';
                this.scoreVal = 10;
                this.expVal = 20;

                // ノックバック用の物理ステータス
                this.knockbackTimer = 0;
                this.kbVx = 0;
                this.kbVy = 0;
                this.gravity = 0.52; 
                this.hasCrashed = false; // 壁にぶつかったフラグ
                
                // 吹き飛ぶときの残像
                this.trail = [];

                if (type === 'slime') {
                    this.width = 36;
                    this.height = 26;
                    this.y = BASE_HEIGHT - this.height - 40;
                    this.maxHp = 30;
                    this.hp = this.maxHp;
                    this.damage = 10;
                    this.speed = 1.2;
                    this.color = '#10b981';
                } else if (type === 'skeleton') {
                    this.width = 38;
                    this.height = 58;
                    this.y = BASE_HEIGHT - this.height - 40;
                    this.maxHp = 60;
                    this.hp = this.maxHp;
                    this.damage = 20;
                    this.speed = 0.8;
                    this.color = '#cbd5e1';
                } else if (type === 'bat') {
                    this.width = 32;
                    this.height = 24;
                    this.y = BASE_HEIGHT - 120 - Math.random() * 80;
                    this.maxHp = 20;
                    this.hp = this.maxHp;
                    this.damage = 8;
                    this.speed = 2.2;
                    this.color = '#a855f7';
                } else if (type === 'boss') {
                    this.width = 80;
                    this.height = 110;
                    this.y = BASE_HEIGHT - this.height - 40;
                    this.maxHp = 350;
                    this.hp = this.maxHp;
                    this.damage = 35;
                    this.speed = 0.6;
                    this.color = '#ef4444';
                    this.scoreVal = 100;
                    this.expVal = 200;
                    bossSpawned = true;
                    document.getElementById('boss-warning').classList.remove('hidden');
                    playSound('boss_spawn');
                }

                this.invulnerableFrames = 0;
                this.animTimer = Math.random() * 100;
            }

            update(playerX) {
                if (this.invulnerableFrames > 0) {
                    this.invulnerableFrames--;
                }

                // ノックバック（吹き飛び中）の処理
                if (this.knockbackTimer > 0) {
                    this.knockbackTimer--;
                    
                    // 横方向の吹き飛び座標計算
                    this.x += this.kbVx;
                    this.kbVx *= 0.94; // スピードの減衰を自然に
                    
                    // 残像を記録
                    this.trail.push({ x: this.x, y: this.y, kbVx: this.kbVx });
                    if (this.trail.length > 6) {
                        this.trail.shift();
                    }

                    // 土煙とスピード風粒子を出す
                    if (this.knockbackTimer % 2 === 0) {
                        const groundY = (this.type === 'bat') ? this.y + this.height : BASE_HEIGHT - 40;
                        spawnDust(this.x + this.width / 2, groundY);
                        spawnWindLine(this.x + this.width / 2, this.y + Math.random() * this.height, this.kbVx);
                    }

                    // 地上キャラは重力による跳ね上がりも計算
                    if (this.type !== 'bat') {
                        this.y += this.kbVy;
                        this.kbVy += this.gravity;
                        
                        const groundY = BASE_HEIGHT - this.height - 40;
                        if (this.y >= groundY) {
                            this.y = groundY;
                            this.kbVy = 0;
                        }
                    }

                    // 💡【大改造！】画面内の両端ぴったりで「壁ドンッ！」とバウンドさせる！
                    const leftLimit = 0;
                    const rightLimit = BASE_WIDTH - this.width; // 💡画面右端ぴったりに壁を作る！

                    if (this.x < leftLimit) {
                        this.x = leftLimit;
                        if (!this.hasCrashed) {
                            this.triggerWallCrash(-1); // 左の壁にクラッシュ
                        }
                    }
                    if (this.x > rightLimit) {
                        this.x = rightLimit;
                        if (!this.hasCrashed) {
                            this.triggerWallCrash(1); // 💡右の壁にクラッシュ！(100%プレイヤーに見える位置)
                        }
                    }

                    this.animTimer++;
                    return; // 気絶中は、通常の追いかけ動きをお休み
                }

                // 通常の動きに戻ったとき、残像を消去する
                if (this.trail.length > 0) {
                    this.trail.shift();
                }
                this.hasCrashed = false; // 壁衝突フラグをリセット

                // 通常の追いかけ動き
                if (this.type !== 'bat') {
                    if (this.x < playerX) {
                        this.vx = this.speed;
                        this.direction = 1;
                    } else {
                        this.vx = -this.speed;
                        this.direction = -1;
                    }
                    this.x += this.vx;
                    this.y = BASE_HEIGHT - this.height - 40;
                } else {
                    if (this.x < playerX) {
                        this.vx = this.speed;
                        this.direction = 1;
                    } else {
                        this.vx = -this.speed;
                        this.direction = -1;
                    }
                    this.x += this.vx;
                    this.y += Math.sin(this.animTimer * 0.1) * 1.5;
                }

                this.animTimer++;
            }

            // 壁に激突した時のバウンド処理
            triggerWallCrash(wallSide) {
                this.hasCrashed = true;
                screenShake = 26; // 画面を大きく揺らす！
                playSound('crash');
                
                // コミカルな激突文字を表示
                spawnDamageText(this.x + this.width / 2, this.y - 45, "壁ドンッ！");
                spawnDamageText(this.x + this.width / 2, this.y - 20, "ドゴォォン！");
                
                // 💡【物理！】壁に当たると「逆方向（プレイヤーの反対方向ではなく内側）」にへばりついて滑り落ちる（跳ね返らず気絶する）
                // プレイヤーを押し返すバグを防ぐため、内側への激しい跳ね返りを無くし、壁際でゆっくりずり落ちるように修正
                this.kbVx = -wallSide * 1.5; // 跳ね返りを1.5に大幅に弱めて、壁際に留まるように！
                this.kbVy = -2.5; 
                this.knockbackTimer = 45; // 激突によるピヨリ時間をより長く！
                
                // 壁激突時のドデカ火花エフェクト
                for (let i = 0; i < 25; i++) {
                    sparks.push(new Spark(this.x + this.width / 2, this.y + this.height / 2, '#fffbeb')); 
                    sparks.push(new Spark(this.x + this.width / 2, this.y + this.height / 2, '#f97316')); 
                    sparks.push(new Spark(this.x + this.width / 2, this.y + this.height / 2, '#ef4444')); 
                }
            }

            draw() {
                // 吹き飛び中の残像を描画
                this.trail.forEach((t, index) => {
                    ctx.save();
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = (index + 1) / 7 * 0.15;
                    ctx.translate(t.x + this.width / 2, t.y + this.height / 2);
                    
                    ctx.rotate(t.kbVx * 0.02);
                    ctx.scale(this.direction, 1);
                    ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                    ctx.restore();
                });

                ctx.save();

                if (this.invulnerableFrames > 0 && Math.floor(this.invulnerableFrames / 3) % 2 === 0) {
                    ctx.globalAlpha = 0.4;
                }

                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                
                // 💡【大改造！】吹き飛ぶスピード（kbVx）に合わせて、体がダイナミックにきりもみ回転してのけぞる！
                if (this.knockbackTimer > 0) {
                    ctx.rotate(this.kbVx * 0.035); // のけぞり回転量を1.5倍に強化！
                }
                
                ctx.scale(this.direction, 1);

                const w = this.width;
                const h = this.height;

                if (this.type === 'slime') {
                    const squish = Math.sin(this.animTimer * 0.15) * 2;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(0, squish, w/2, h/2 - squish, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(4, -2 + squish, 3, 3);
                    ctx.fillRect(10, -2 + squish, 3, 3);
                } 
                else if (this.type === 'skeleton') {
                    const bounce = Math.sin(this.animTimer * 0.1) * 2;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-10, -h/2 + bounce, 20, 16);
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(2, -h/2 + 6 + bounce, 4, 4);
                    ctx.fillRect(-6, -h/2 + 6 + bounce, 4, 4);

                    ctx.fillStyle = this.color;
                    ctx.fillRect(-6, -h/2 + 18, 12, 18);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(-8, -h/2 + 22, 16, 2);
                    ctx.fillRect(-8, -h/2 + 28, 16, 2);

                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(8, -h/2 + 10, 4, 16);
                } 
                else if (this.type === 'bat') {
                    const wing = Math.sin(this.animTimer * 0.3) * h/2;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, w/3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(-w/4, 0);
                    ctx.lineTo(-w, -wing);
                    ctx.lineTo(-w/2, wing/2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(w/4, 0);
                    ctx.lineTo(w, -wing);
                    ctx.lineTo(w/2, wing/2);
                    ctx.fill();
                    
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(2, -2, 2, 2);
                } 
                else if (this.type === 'boss') {
                    const hover = Math.sin(this.animTimer * 0.05) * 3;
                    
                    ctx.fillStyle = '#450a0a';
                    ctx.fillRect(-w/2 - 5, -h/2 + 24 + hover, w + 10, h - 30);

                    ctx.fillStyle = '#111827';
                    ctx.fillRect(-w/2, -h/2 + 20 + hover, w, h - 40);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(-6, -6 + hover, 12, 12);

                    ctx.fillStyle = '#1f2937';
                    ctx.fillRect(-20, -h/2 + hover, 40, 24);
                    ctx.beginPath();
                    ctx.moveTo(-18, -h/2 + hover);
                    ctx.lineTo(-24, -h/2 - 12 + hover);
                    ctx.lineTo(-10, -h/2 + hover);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(18, -h/2 + hover);
                    ctx.lineTo(24, -h/2 - 12 + hover);
                    ctx.lineTo(10, -h/2 + hover);
                    ctx.fill();

                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(w/2 - 10, -h/2 - 10 + hover, 16, h - 10);
                    ctx.fillStyle = '#991b1b';
                    ctx.fillRect(w/2 - 14, -h/2 + hover + 10, 24, 6);
                }

                ctx.restore();

                // 吹き飛んで気絶している間、頭上にくるくる回るピヨピヨ星（★）を描画
                if (this.knockbackTimer > 0) {
                    ctx.save();
                    const starCount = 3;
                    const radius = 15;
                    const centerX = this.x + this.width / 2;
                    const centerY = this.y - 15;
                    
                    for (let i = 0; i < starCount; i++) {
                        const angle = (this.animTimer * 0.1) + (i * Math.PI * 2 / starCount);
                        const starX = centerX + Math.cos(angle) * radius;
                        const starY = centerY + Math.sin(angle) * radius * 0.4; 
                        
                        ctx.font = '12px sans-serif';
                        ctx.fillStyle = '#facc15'; 
                        ctx.textAlign = 'center';
                        ctx.fillText('★', starX, starY);
                    }
                    ctx.restore();
                }

                // 敵体力ゲージ
                const barWidth = this.width;
                const barHeight = 4;
                const barX = this.x;
                const barY = this.y - 8;

                ctx.fillStyle = '#475569';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                ctx.fillStyle = '#ef4444';
                const currentHpWidth = (this.hp / this.maxHp) * barWidth;
                ctx.fillRect(barX, barY, currentHpWidth > 0 ? currentHpWidth : 0, barHeight);
            }

            takeDamage(amount, playerX) {
                if (this.invulnerableFrames > 0) return;
                this.hp -= amount;
                this.invulnerableFrames = 15; 
                playSound('hit');

                // ヒットストップ
                hitStopTimer = 4; 
                screenShake = 16; 

                // ダメージテキストと「吹き飛び！」文字
                const soundWord = ["ブッ飛び！", "バシィィッ！", "ズサーーーッ！"][Math.floor(Math.random() * 3)];
                spawnDamageText(this.x + this.width / 2, this.y - 30, soundWord);
                spawnDamageText(this.x + this.width / 2, this.y, amount);

                // 💡【大改造！】火花が「吹き飛ぶ方向」へ扇状にブワッと吹き出す！
                const kbDir = (this.x + this.width / 2 > playerX) ? 1 : -1;
                spawnDirectionalSparks(this.x + this.width / 2, this.y + this.height / 2, this.color, kbDir);

                // ノックバック速度を蓄積加算！
                this.knockbackTimer = 45; 

                if (this.type === 'boss') {
                    this.kbVx += kbDir * 11; 
                    this.kbVy = -3.5;
                } else if (this.type === 'bat') {
                    this.kbVx += kbDir * 23; 
                } else {
                    this.kbVx += kbDir * 18; // 目で追える極上のスライドスピードに調整
                    this.kbVy = -6.5;        
                }
            }
        }

        // ----------------------------------------------------
        // 特殊効果・エフェクトクラス
        // ----------------------------------------------------

        class SlashEffect {
            constructor(x, y, dir) {
                this.x = x;
                this.y = y;
                this.dir = dir;
                this.life = 14;
                this.maxLife = 14;
            }
            update() {
                this.life--;
                this.x += this.dir * 6;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.dir, 1);
                
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.life / this.maxLife})`;
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(-20, 0, 75, -Math.PI/3, Math.PI/3);
                ctx.stroke();

                ctx.strokeStyle = `rgba(59, 130, 246, ${this.life / this.maxLife})`;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(-20, 0, 72, -Math.PI/3.2, Math.PI/3.2);
                ctx.stroke();

                ctx.restore();
            }
        }

        class DamageText {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.vy = -1.2;
                this.life = 35; 
                this.maxLife = 35;
            }
            update() {
                this.y += this.vy;
                this.life--;
            }
            draw() {
                ctx.save();
                ctx.font = 'bold 22px "Impact", sans-serif'; 
                ctx.fillStyle = `rgba(255, 239, 10, ${this.life / this.maxLife})`;
                ctx.strokeStyle = `rgba(0, 0, 0, ${this.life / this.maxLife})`;
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                // 特定の方向へ飛び散るようにベクトルを受け取る
                this.vx = vx;
                this.vy = vy;
                this.color = color || '#ffffff';
                this.life = 20 + Math.random() * 15;
                this.size = 3 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.12; // 重力
                this.life--;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 35;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        // 土煙（砂埃）エフェクト
        class DustParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -Math.random() * 1.5 - 0.5;
                this.size = 5 + Math.random() * 7;
                this.life = 12 + Math.random() * 8;
                this.maxLife = this.life;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(148, 163, 184, ${this.life / this.maxLife * 0.4})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // スピード感を引き立てる風のソニックライン
        class WindLine {
            constructor(x, y, vx) {
                this.x = x;
                this.y = y;
                this.vx = vx * 0.75; 
                this.life = 14;
                this.maxLife = 14;
                this.width = 20 + Math.random() * 30;
            }
            update() {
                this.x += this.vx;
                this.life--;
            }
            draw() {
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.life / this.maxLife * 0.4})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.width * Math.sign(this.vx), this.y);
                ctx.stroke();
                ctx.restore();
            }
        }

        class LevelUpRing {
            constructor(player) {
                this.player = player;
                this.radius = 10;
                this.life = 40;
                this.maxLife = 40;
            }
            update() {
                this.radius += 2.5;
                this.life--;
            }
            draw() {
                ctx.save();
                ctx.strokeStyle = `rgba(250, 204, 21, ${this.life / this.maxLife})`;
                ctx.lineWidth = 4;
                ctx.shadowColor = '#eab308';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.player.x + this.player.width/2, this.player.y + this.player.height, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.font = 'bold 20px sans-serif';
                ctx.fillStyle = `rgba(250, 204, 21, ${this.life / this.maxLife})`;
                ctx.textAlign = 'center';
                ctx.fillText('LEVEL UP!!', this.player.x + this.player.width/2, this.player.y - 40);
                ctx.restore();
            }
        }

        class Environment {
            constructor() {
                this.bgScroll = 0;
                this.stars = [];
                for (let i = 0; i < 30; i++) {
                    this.stars.push({
                        x: Math.random() * BASE_WIDTH,
                        y: Math.random() * (BASE_HEIGHT - 150),
                        size: Math.random() * 2
                    });
                }
            }
            update(playerSpeed) {
                this.bgScroll = (this.bgScroll - playerSpeed * 0.1) % BASE_WIDTH;
            }
            draw() {
                const grad = ctx.createLinearGradient(0, 0, 0, BASE_HEIGHT);
                grad.addColorStop(0, '#020617');
                grad.addColorStop(0.6, '#0f172a');
                grad.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

                ctx.fillStyle = '#ffffff';
                this.stars.forEach(s => {
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });

                ctx.fillStyle = '#11103a';
                ctx.beginPath();
                ctx.moveTo(0, BASE_HEIGHT);
                ctx.lineTo(200 + this.bgScroll * 0.5, 180);
                ctx.lineTo(450 + this.bgScroll * 0.5, 300);
                ctx.lineTo(700 + this.bgScroll * 0.5, 120);
                ctx.lineTo(1000 + this.bgScroll * 0.5, BASE_HEIGHT);
                ctx.fill();

                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, BASE_HEIGHT - 40, BASE_WIDTH, 40);
                
                ctx.fillStyle = '#0f766e';
                ctx.fillRect(0, BASE_HEIGHT - 42, BASE_WIDTH, 4);
            }
        }

        // ----------------------------------------------------
        // 게임制御実体 & リスト
        // ----------------------------------------------------
        let player = new Player();
        const env = new Environment();
        
        let enemies = [];
        let slashes = [];
        let damageTexts = [];
        let sparks = [];
        let effects = [];
        let dusts = []; 
        let windLines = []; 

        let spawnTimer = 0;

        function spawnAttackSlash(p) {
            const slashX = p.x + p.width/2 + p.direction * 45;
            const slashY = p.y + p.height/2;
            slashes.push(new SlashEffect(slashX, slashY, p.direction));
        }

        function spawnDamageText(x, y, amt) {
            const clampedX = Math.max(20, Math.min(BASE_WIDTH - 20, x));
            damageTexts.push(new DamageText(clampedX, y, amt));
        }

        // 吹き飛ぶ方向へ扇状にスパークを飛び散らせる
        function spawnDirectionalSparks(x, y, color, kbDir) {
            for (let i = 0; i < 18; i++) {
                const baseAngle = kbDir === 1 ? 0 : Math.PI;
                const spreadAngle = baseAngle + (Math.random() - 0.5) * 1.2; 
                const speed = 3 + Math.random() * 8;
                
                const vx = Math.cos(spreadAngle) * speed;
                const vy = Math.sin(spreadAngle) * speed - 1; 
                
                sparks.push(new Spark(x, y, color, vx, vy));
            }
        }

        function spawnDust(x, y) {
            dusts.push(new DustParticle(x, y));
        }

        function spawnWindLine(x, y, vx) {
            windLines.push(new WindLine(x, y, vx));
        }

        function spawnLevelUpEffect(p) {
            effects.push(new LevelUpRing(p));
        }

        // ----------------------------------------------------
        // コア・ゲームループ & ロジック
        // ----------------------------------------------------

        function update() {
            if (gameState !== 'PLAYING') return;

            // ヒットストップ
            if (hitStopTimer > 0) {
                hitStopTimer--;
                return; 
            }

            env.update(player.vx);
            player.update();

            spawnTimer++;
            if (!bossSpawned) {
                let spawnInterval = Math.max(80, 180 - Math.floor(score / 5));
                if (spawnTimer >= spawnInterval) {
                    spawnTimer = 0;
                    
                    const rand = Math.random();
                    let type = 'slime';
                    if (score >= 120 && rand < 0.25) {
                        type = 'bat';
                    } else if (score >= 60 && rand < 0.6) {
                        type = 'skeleton';
                    }
                    enemies.push(new Enemy(type));
                }

                if (score >= 250) {
                    enemies.push(new Enemy('boss'));
                }
            }

            enemies.forEach(e => e.update(player.x));
            slashes.forEach(s => s.update());
            damageTexts.forEach(d => d.update());
            sparks.forEach(p => p.update());
            dusts.forEach(du => du.update());
            windLines.forEach(w => w.update()); 
            effects.forEach(f => f.update());

            // あたり判定
            if (player.isAttacking) {
                const margin = 20; 
                let rangeX, rangeW;
                
                if (player.direction === 1) {
                    rangeX = player.x + player.width - margin;
                    rangeW = player.attackRange + margin;
                } else {
                    rangeX = player.x - player.attackRange;
                    rangeW = player.attackRange + margin;
                }
                
                const attackBox = {
                    x: rangeX,
                    y: player.y - 15, 
                    w: rangeW,
                    h: player.height + 30
                };

                enemies.forEach(e => {
                    if (checkRectCollision(attackBox, e)) {
                        e.takeDamage(player.attackPower, player.x);
                        
                        if (e.hp <= 0) {
                            score += e.scoreVal;
                            player.gainExp(e.expVal);
                            
                            if (e.type === 'boss') {
                                gameClear();
                            }
                        }
                        updateUI();
                    }
                });
            }

            // 敵からプレイヤーへの接触ダメージ（攻撃中なら完全にすり抜けてノーダメージ！）
            enemies.forEach(e => {
                if (!player.isAttacking && checkRectCollision(player, e) && e.hp > 0) {
                    player.takeDamage(e.damage, e.x + e.width / 2);
                }
            });

            enemies = enemies.filter(e => e.hp > 0 || e.trail.length > 0); 
            slashes = slashes.filter(s => s.life > 0);
            damageTexts = damageTexts.filter(d => d.life > 0);
            sparks = sparks.filter(p => p.life > 0);
            dusts = dusts.filter(du => du.life > 0);
            windLines = windLines.filter(w => w.life > 0); 
            effects = effects.filter(f => f.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

            ctx.save();
            // 画面シェイク効果
            if (screenShake > 0) {
                const shakeIntensity = Math.min(screenShake, 11);
                const dx = (Math.random() - 0.5) * shakeIntensity;
                const dy = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(dx, dy);
                screenShake *= 0.84; 
                if (screenShake < 0.5) screenShake = 0;
            }

            env.draw();

            effects.forEach(f => f.draw());
            dusts.forEach(du => du.draw()); 
            windLines.forEach(w => w.draw()); 
            sparks.forEach(p => p.draw());
            enemies.forEach(e => e.draw());
            player.draw();
            slashes.forEach(s => s.draw());
            damageTexts.forEach(d => d.draw());

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function checkRectCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function updateUI() {
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = level;
        }

        function resetGame() {
            player = new Player();
            enemies = [];
            slashes = [];
            damageTexts = [];
            sparks = [];
            dusts = [];
            windLines = [];
            effects = [];
            score = 0;
            level = 1;
            exp = 0;
            nextLevelExp = 100;
            bossSpawned = false;
            spawnTimer = 0;
            screenShake = 0;
            hitStopTimer = 0;
            
            document.getElementById('boss-warning').classList.add('hidden');
            updateUI();
        }

        const overlay = document.getElementById('overlay');
        const mStart = document.getElementById('menu-start');
        const mGameover = document.getElementById('menu-gameover');
        const mClear = document.getElementById('menu-clear');
        const mPause = document.getElementById('menu-pause');

        function startGame() {
            initAudio();
            resetGame();
            gameState = 'PLAYING';
            overlay.classList.add('hidden');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-level').innerText = level;
            
            overlay.classList.remove('hidden');
            mStart.classList.add('hidden');
            mGameover.classList.remove('hidden');
            mClear.classList.add('hidden');
            mPause.classList.add('hidden');
        }

        function gameClear() {
            gameState = 'CLEAR';
            document.getElementById('clear-score').innerText = score;
            
            overlay.classList.remove('hidden');
            mStart.classList.add('hidden');
            mGameover.classList.add('hidden');
            mClear.classList.remove('hidden');
            mPause.classList.add('hidden');
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                overlay.classList.remove('hidden');
                mStart.classList.add('hidden');
                mGameover.classList.add('hidden');
                mClear.classList.add('hidden');
                mPause.classList.remove('hidden');
                document.getElementById('btn-pause').innerText = '再開';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                overlay.classList.add('hidden');
                document.getElementById('btn-pause').innerText = '一時停止';
            }
        }

        // ----------------------------------------------------
        // イベントリスナー設定
        // ----------------------------------------------------

        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-restart').addEventListener('click', startGame);
        document.getElementById('btn-clear-restart').addEventListener('click', startGame);
        document.getElementById('btn-resume').addEventListener('click', togglePause);
        document.getElementById('btn-pause').addEventListener('click', togglePause);

        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            keys[e.code] = true;
            
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(e.key) || ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => {
            keys[e.key] = false;
            keys[e.code] = false;
        });

        const setTouch = (id, targetKey) => {
            const btn = document.getElementById(id);
            
            const startAction = (e) => {
                if (e) e.preventDefault();
                initAudio();
                touchInputs[targetKey] = true;
                
                if (targetKey === 'attack' && gameState === 'PLAYING') {
                    if (player.attackCooldown === 0) {
                        player.performAttack();
                    }
                }
                if (targetKey === 'jump' && gameState === 'PLAYING' && player.isGrounded) {
                    player.vy = -player.jumpPower;
                    player.isGrounded = false;
                    playSound('jump');
                }
            };

            const endAction = (e) => {
                if (e) e.preventDefault();
                touchInputs[targetKey] = false;
            };
            
            btn.addEventListener('touchstart', startAction, { passive: false });
            btn.addEventListener('touchend', endAction, { passive: false });
            btn.addEventListener('touchcancel', endAction, { passive: false });
            btn.addEventListener('mousedown', startAction);
        };

        setTouch('ctrl-left', 'left');
        setTouch('ctrl-right', 'right');
        setTouch('ctrl-jump', 'jump');
        setTouch('ctrl-attack', 'attack');

        window.addEventListener('mouseup', () => {
            touchInputs.left = false;
            touchInputs.right = false;
            touchInputs.jump = false;
            touchInputs.attack = false;
        });

        loop();
    </script>
</body>
</html>
