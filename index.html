<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Human Tennis Battle - Time Attack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2f855a;
            touch-action: none;
            font-family: sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            background-color: #38a169;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            margin: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        .score-box {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 1rem;
            text-align: center;
            min-width: 100px;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 1.5rem;
            color: #2d3748;
            text-align: center;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 20;
            min-width: 320px;
        }
        #stage-indicator {
            position: absolute;
            top: 110px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.6rem;
            pointer-events: none;
            letter-spacing: 0.2em;
            z-index: 5;
            background: rgba(0,0,0,0.2);
            padding: 5px 0;
        }
        #tiebreak-alert {
            position: absolute;
            top: 160px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ff4d4d;
            font-weight: 900;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 10;
            display: none;
            text-shadow: 2px 2px 0px #fff;
            animation: pulse 1s infinite;
        }
        #countdown-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 8rem;
            font-weight: 900;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 30;
            display: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        #speed-display, #levelup-display {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 900;
            font-style: italic;
            text-shadow: 3px 3px 0px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 15;
            white-space: nowrap;
        }
        #speed-display {
            top: 60%;
            color: #fff176;
            font-size: 2.5rem;
        }
        #levelup-display {
            top: 45%;
            color: #ffeb3b;
            font-size: 4rem;
            letter-spacing: -0.05em;
        }
        .game-btn {
            background-color: #2f855a;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: bold;
            margin: 0.5rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            pointer-events: auto;
            display: inline-block;
        }
        .game-btn:hover {
            background-color: #276749;
            transform: scale(1.05);
        }
        .trophy-anim {
            animation: bounce 2s infinite;
            margin: 0 auto 1rem;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        #timer-display {
            font-family: monospace;
            font-size: 1.2rem;
            color: #4a5568;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="score-box">
            <p class="text-xs uppercase opacity-80" id="cpu-name">CPU SCORE</p>
            <p class="text-3xl font-bold" id="cpu-score">0</p>
        </div>
        <div class="score-box">
            <p class="text-xs uppercase opacity-80" id="player-title">PLAYER SCORE</p>
            <p class="text-3xl font-bold" id="player-score">0</p>
        </div>
    </div>

    <div id="stage-indicator">LEVEL 1: BEGINNER</div>
    <div id="tiebreak-alert">TIE-BREAK!</div>
    <div id="countdown-display">3</div>
    <div id="speed-display">120 km/h</div>
    <div id="levelup-display">PLAYER UPGRADED!</div>

    <div id="message-box">
        <div id="trophy-display" style="display:none;" class="trophy-anim">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="#ECC94B" style="margin: auto;">
                <path d="M18 2H6c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 13.9V17H8v2h8v-2h-3v-3.1a5.01 5.01 0 002.61-3.96C18.08 9.63 20 7.55 20 5V4c0-1.1-.9-2-2-2zM6 7V4h2v3c0 .55-.45 1-1 1s-1-.45-1-1zm12 0c0 .55-.45 1-1 1s-1-.45-1-1V4h2v3z"/>
            </svg>
        </div>
        <h2 id="msg-title" class="text-3xl font-bold mb-2 uppercase tracking-tighter">Human Tennis Battle</h2>
        <p id="msg-body" class="mb-4 text-lg text-gray-600">モードを選択してください</p>
        <div id="timer-display" style="display:none;"></div>
        <div id="mode-selection">
            <button class="game-btn" onclick="selectMode('singles')">シングルス</button>
            <button class="game-btn" onclick="selectMode('doubles')">ダブルス</button>
        </div>
        <div id="continue-selection" style="display:none;">
            <button class="game-btn" id="start-btn" onclick="startCountdown()">試合開始！</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pScoreEl = document.getElementById('player-score');
        const cScoreEl = document.getElementById('cpu-score');
        const cpuNameEl = document.getElementById('cpu-name');
        const pTitleEl = document.getElementById('player-title');
        const stageEl = document.getElementById('stage-indicator');
        const tiebreakEl = document.getElementById('tiebreak-alert');
        const countdownEl = document.getElementById('countdown-display');
        const speedEl = document.getElementById('speed-display');
        const levelUpEl = document.getElementById('levelup-display');
        const messageBox = document.getElementById('message-box');
        const trophyDisplay = document.getElementById('trophy-display');
        const msgTitle = document.getElementById('msg-title');
        const msgBody = document.getElementById('msg-body');
        const modeSelection = document.getElementById('mode-selection');
        const continueSelection = document.getElementById('continue-selection');
        const startBtn = document.getElementById('start-btn');
        const timerDisplay = document.getElementById('timer-display');

        let tournamentStage = 0;
        let isTieBreak = false;
        let gameMode = 'singles'; 
        let isCountingDown = false;
        
        // タイム計測用
        let startTime = 0;
        let finalTime = null;

        const opponents = [
            { 
                name: "Beginner", speed: 3.5, ballSpeed: 6, color: "#feb2b2", serveBase: 120, label: "LEVEL 1: BEGINNER", 
                pSpeed: 7.5, pColor: "#bee3f8", pRacketSize: 1.0, pTitle: "ROOKIE" 
            },
            { 
                name: "Pro", speed: 4.5, ballSpeed: 8, color: "#fbd38d", serveBase: 150, label: "LEVEL 2: PRO", 
                pSpeed: 8.0, pColor: "#63b3ed", pRacketSize: 1.1, pTitle: "ELITE" 
            },
            { 
                name: "Veteran", speed: 5.5, ballSpeed: 9.5, color: "#faf089", serveBase: 180, label: "LEVEL 3: VETERAN", 
                pSpeed: 8.5, pColor: "#4fd1c5", pRacketSize: 1.2, pTitle: "MASTER" 
            },
            { 
                name: "Champion", speed: 6.5, ballSpeed: 11, color: "#9ae6b4", serveBase: 210, label: "LEVEL 4: CHAMPION", 
                pSpeed: 9.0, pColor: "#9f7aea", pRacketSize: 1.3, pTitle: "LEGEND" 
            },
            { 
                name: "World No.1", speed: 7.8, ballSpeed: 13, color: "#63b3ed", serveBase: 250, label: "LEVEL 5: WORLD NO.1", 
                pSpeed: 10.0, pColor: "#ed64a6", pRacketSize: 1.4, pTitle: "GOAT" 
            }
        ];

        let player = { x: 0, y: 0, score: 0, swing: 0, speed: 7.5, color: "#bee3f8", racketScale: 1.0 };
        let partner = { x: 0, y: 0, swing: 0, speed: 6.0, color: "#a0aec0", active: false };
        let cpu = { x: 0, y: 80, score: 0, speed: 3.0, color: "#feb2b2" };
        let cpuPartner = { x: 0, y: 80, swing: 0, speed: 3.0, color: "#fc8181", active: false };
        
        let ball = { x: 0, y: 0, dx: 0, dy: 0, radius: 8, speed: 6, serving: true };
       
        let keys = {};
        let gameActive = false;
        let animationId;
        let speedTimeout;
        let particleList = [];

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!gameActive && !isCountingDown) {
                player.x = canvas.width / 2;
                player.y = canvas.height * 0.85;
                partner.x = canvas.width * 0.3;
                partner.y = canvas.height * 0.7;
                cpu.x = canvas.width / 2;
                cpuPartner.x = canvas.width * 0.7;
                cpuPartner.y = 120;
            }
        }

        window.addEventListener('resize', resize);
        resize();

        function selectMode(mode) {
            gameMode = mode;
            partner.active = (mode === 'doubles');
            cpuPartner.active = (mode === 'doubles');
            modeSelection.style.display = 'none';
            continueSelection.style.display = 'block';
            msgBody.textContent = mode === 'singles' ? "シングルスで頂点を目指せ！" : "ダブルスで最強のペアを証明しろ！";
            timerDisplay.style.display = 'none';
        }

        function startCountdown() {
            // ステージ1の開始時にタイマーをセット
            if (tournamentStage === 0) {
                startTime = Date.now();
                finalTime = null;
            }
            
            messageBox.style.display = 'none';
            isCountingDown = true;
            countdownEl.style.display = 'block';
            let count = 3;
            countdownEl.textContent = count;

            const timer = setInterval(() => {
                count--;
                if (count === 0) {
                    countdownEl.textContent = "GO!";
                } else if (count < 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    isCountingDown = false;
                    nextMatch();
                } else {
                    countdownEl.textContent = count;
                }
            }, 800);
        }

        function createLevelUpParticles() {
            for (let i = 0; i < 40; i++) {
                particleList.push({
                    x: player.x,
                    y: player.y,
                    dx: (Math.random() - 0.5) * 12,
                    dy: (Math.random() - 0.5) * 12,
                    life: 80,
                    color: `hsl(${Math.random() * 360}, 80%, 60%)`
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'Enter') handleAction();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function handleInteraction(clientX, clientY) {
            if (!gameActive || isCountingDown) return;
            const rect = canvas.getBoundingClientRect();
            player.x = clientX - rect.left;
            const mouseY = clientY - rect.top - 40; 
            if (mouseY > canvas.height / 2 + 50) player.y = mouseY;
            if (ball.serving) handleAction();
        }

        canvas.addEventListener('mousemove', (e) => handleInteraction(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });
        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) handleAction(); });

        function showSpeed() {
            const base = opponents[Math.min(tournamentStage, opponents.length - 1)].serveBase;
            speedEl.textContent = `Serve: ${base + Math.floor(Math.random() * 20)} km/h`;
            speedEl.style.opacity = '1';
            if (speedTimeout) clearTimeout(speedTimeout);
            speedTimeout = setTimeout(() => speedEl.style.opacity = '0', 1200);
        }

        function handleAction() {
            if (!gameActive || isCountingDown) return;
            if (ball.serving) {
                ball.serving = false;
                const stageData = opponents[Math.min(tournamentStage, opponents.length - 1)];
                ball.speed = stageData.ballSpeed;
                ball.dy = -ball.speed;
                ball.dx = (Math.random() - 0.5) * 8;
                player.swing = 15;
                showSpeed();
            } else if (player.swing <= 0) {
                player.swing = 15;
            }
        }

        function resetBall(isPlayerServe) {
            ball.serving = true;
            ball.speed = opponents[Math.min(tournamentStage, opponents.length - 1)].ballSpeed;
            if (isPlayerServe) {
                ball.y = player.y - 35;
                ball.x = player.x + 25;
            } else {
                ball.serving = false;
                ball.x = cpu.x;
                ball.y = cpu.y + 35;
                ball.dy = ball.speed;
                ball.dx = (Math.random() - 0.5) * 8;
                showSpeed();
            }
        }

        function nextMatch() {
            if (tournamentStage >= opponents.length) tournamentStage = 0;
            const config = opponents[tournamentStage];
            
            cpu.speed = config.speed;
            cpu.color = config.color;
            cpuPartner.speed = config.speed * 0.9;
            cpuPartner.color = config.color === "#63b3ed" ? "#4299e1" : "#e53e3e";
            
            cpuNameEl.textContent = config.name + (gameMode === 'doubles' ? " PAIR" : " SCORE");
            player.speed = config.pSpeed;
            player.color = config.pColor;
            player.racketScale = config.pRacketSize;
            pTitleEl.textContent = config.pTitle + (gameMode === 'doubles' ? " PAIR" : " (YOU)");
            stageEl.textContent = config.label + " (" + gameMode.toUpperCase() + ")";
            
            player.score = 0;
            cpu.score = 0;
            isTieBreak = false;
            tiebreakEl.style.display = 'none';

            player.y = canvas.height * 0.85;
            player.x = canvas.width / 2;
            partner.x = canvas.width * 0.3;
            partner.y = canvas.height * 0.7;
            cpu.x = canvas.width / 2;
            cpuPartner.x = canvas.width * 0.7;
            
            updateScoreDisplay();
            resetBall(true);
            messageBox.style.display = 'none';
            trophyDisplay.style.display = 'none';
            gameActive = true;
            if (animationId) cancelAnimationFrame(animationId);
            draw();
        }

        function updateScoreDisplay() {
            pScoreEl.textContent = player.score;
            cScoreEl.textContent = cpu.score;

            if (!isTieBreak && player.score === 4 && cpu.score === 4) {
                isTieBreak = true;
                tiebreakEl.style.display = 'block';
            }

            let gameOver = false;
            let playerWins = false;

            if (isTieBreak) {
                if (Math.abs(player.score - cpu.score) >= 2) {
                    gameOver = true;
                    playerWins = player.score > cpu.score;
                }
            } else {
                if (player.score >= 5 || cpu.score >= 5) {
                    gameOver = true;
                    playerWins = player.score >= 5;
                }
            }
           
            if (gameOver) {
                gameActive = false;
                if (playerWins) {
                    tournamentStage++;
                    if (tournamentStage >= opponents.length) {
                        // 全クリした瞬間の時間を記録
                        finalTime = Date.now() - startTime;
                        msgTitle.textContent = "THE GOAT! 🏆";
                        msgBody.textContent = "全てのステージをクリア！あなたはテニス界の伝説です！";
                        timerDisplay.innerHTML = `<span class="text-sm">CLEAR TIME:</span><br><span class="text-2xl">${formatTime(finalTime)}</span>`;
                        timerDisplay.style.display = 'block';
                        startBtn.textContent = "リスタート";
                        trophyDisplay.style.display = 'block';
                        tournamentStage = 0; // リセット
                    } else {
                        createLevelUpParticles();
                        msgTitle.textContent = "WINNER!";
                        msgBody.textContent = "素晴らしい勝利！次のレベルへ進みます。";
                        timerDisplay.style.display = 'none';
                        startBtn.textContent = "次へ進む";
                    }
                } else {
                    msgTitle.textContent = "DEFEAT";
                    msgBody.textContent = "残念！次こそは勝利を掴みましょう！";
                    timerDisplay.style.display = 'none';
                    startBtn.textContent = "リベンジする";
                    tournamentStage = 0; // 負けたら最初から
                }
                setTimeout(() => {
                    messageBox.style.display = 'block';
                    continueSelection.style.display = 'block';
                    modeSelection.style.display = 'none';
                }, 500);
            }
        }

        function drawHuman(x, y, isPlayerSide, swingFrame, humanColor, racketScale = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.beginPath(); ctx.ellipse(0, 10, 20, 10, 0, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.lineCap = "round";
            ctx.fillStyle = humanColor;
            ctx.beginPath(); ctx.arc(0, -40, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -10); ctx.stroke();
            
            let walk = Math.sin(Date.now() / 100) * 6;
            ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(-12 + walk, 8);
            ctx.moveTo(0, -10); ctx.lineTo(12 - walk, 8); ctx.stroke();

            let armAngle = isPlayerSide ? (swingFrame > 0 ? -Math.PI/1.1 : Math.PI/4) : Math.PI/4;
            let racketAngle = isPlayerSide ? (swingFrame > 0 ? -1.3 : 0.3) : 2.5;

            ctx.save();
            ctx.translate(0, -25); ctx.rotate(armAngle);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(25, 0); ctx.stroke();
            ctx.translate(25, 0); ctx.rotate(racketAngle); ctx.scale(racketScale, racketScale); 
            ctx.strokeStyle = isPlayerSide ? "#48bb78" : "#f56565"; ctx.lineWidth = 4 / racketScale;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(15, 0); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(28, 0, 13, 20, Math.PI/2, 0, Math.PI*2); ctx.stroke();
            ctx.restore();
            ctx.restore();
        }

        function update() {
            if (!gameActive || isCountingDown) return;
            particleList.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                if (p.life <= 0) particleList.splice(i, 1);
            });

            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;

            player.x = Math.max(45, Math.min(canvas.width - 45, player.x));
            player.y = Math.max(canvas.height / 2 + 50, Math.min(canvas.height - 45, player.y));

            if (ball.serving) {
                ball.x = player.x + 25; ball.y = player.y - 35;
                return;
            }

            ball.x += ball.dx; ball.y += ball.dy;
            if (ball.x < ball.radius + 30 || ball.x > canvas.width - ball.radius - 30) ball.dx *= -1;

            if (cpuPartner.active) {
                if (ball.x < canvas.width / 2) {
                    if (cpu.x < ball.x - 5) cpu.x += cpu.speed;
                    else if (cpu.x > ball.x + 5) cpu.x -= cpu.speed;
                } else {
                    if (cpuPartner.x < ball.x - 5) cpuPartner.x += cpuPartner.speed;
                    else if (cpuPartner.x > ball.x + 5) cpuPartner.x -= cpuPartner.speed;
                }
            } else {
                if (cpu.x < ball.x - 5) cpu.x += cpu.speed;
                else if (cpu.x > ball.x + 5) cpu.x -= cpu.speed;
            }
            
            cpu.x = Math.max(45, Math.min(canvas.width - 45, cpu.x));
            cpuPartner.x = Math.max(45, Math.min(canvas.width - 45, cpuPartner.x));

            if (partner.active) {
                if (ball.dy > 0 && Math.abs(ball.x - player.x) > 150) {
                    if (partner.x < ball.x - 5) partner.x += partner.speed;
                    else if (partner.x > ball.x + 5) partner.x -= ball.speed;
                    if (Math.abs(ball.y - partner.y) < 50) partner.swing = 15;
                } else {
                    let homeX = canvas.width * 0.3;
                    if (partner.x < homeX - 5) partner.x += partner.speed * 0.5;
                    else if (partner.x > homeX + 5) partner.x -= partner.speed * 0.5;
                }
                partner.x = Math.max(45, Math.min(canvas.width - 45, partner.x));
            }

            if (ball.dy > 0 && Math.abs(ball.y - player.y + 10) < 40) {
                if (Math.abs(ball.x - player.x) < (60 * player.racketScale) && player.swing > 0) {
                    ball.dy = -ball.speed;
                    ball.dx = (ball.x - player.x) * 0.45;
                    ball.y = player.y - 45;
                }
            }
            if (partner.active && ball.dy > 0 && Math.abs(ball.y - partner.y + 10) < 40) {
                if (Math.abs(ball.x - partner.x) < 60 && partner.swing > 0) {
                    ball.dy = -ball.speed;
                    ball.dx = (ball.x - partner.x) * 0.45;
                    ball.y = partner.y - 45;
                }
            }
            if (ball.dy < 0 && Math.abs(ball.y - cpu.y - 10) < 40) {
                if (Math.abs(ball.x - cpu.x) < 55) {
                    ball.dy = ball.speed;
                    ball.dx = (ball.x - cpu.x) * 0.35;
                    ball.y = cpu.y + 45;
                }
            }
            if (cpuPartner.active && ball.dy < 0 && Math.abs(ball.y - cpuPartner.y - 10) < 40) {
                if (Math.abs(ball.x - cpuPartner.x) < 55) {
                    ball.dy = ball.speed;
                    ball.dx = (ball.x - cpuPartner.x) * 0.35;
                    ball.y = cpuPartner.y + 45;
                }
            }

            if (ball.y < 0) {
                player.score++; updateScoreDisplay();
                if (gameActive) resetBall(false);
            } else if (ball.y > canvas.height) {
                cpu.score++; updateScoreDisplay();
                if (gameActive) resetBall(true);
            }

            if (player.swing > 0) player.swing--;
            if (partner.swing > 0) partner.swing--;
        }

        function draw() {
            ctx.fillStyle = "#38a169"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 4;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
            ctx.beginPath();
            ctx.moveTo(80, 30); ctx.lineTo(80, canvas.height - 30);
            ctx.moveTo(canvas.width - 80, 30); ctx.lineTo(canvas.width - 80, canvas.height - 30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 30); ctx.lineTo(canvas.width / 2, canvas.height - 30);
            ctx.moveTo(30, canvas.height / 2); ctx.lineTo(canvas.width - 30, canvas.height / 2);
            ctx.stroke();

            particleList.forEach(p => {
                ctx.globalAlpha = p.life / 80; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ccff00"; ctx.fill(); ctx.strokeStyle = "#333"; ctx.lineWidth = 1; ctx.stroke();

            drawHuman(player.x, player.y, true, player.swing, player.color, player.racketScale);
            if (partner.active) drawHuman(partner.x, partner.y, true, partner.swing, partner.color);
            drawHuman(cpu.x, cpu.y, false, 0, cpu.color);
            if (cpuPartner.active) drawHuman(cpuPartner.x, cpuPartner.y, false, 0, cpuPartner.color);

            update();
            if (gameActive || isCountingDown) animationId = requestAnimationFrame(draw);
        }

        window.onload = () => { resize(); messageBox.style.display = 'block'; };
    </script>
</body>
</html>
