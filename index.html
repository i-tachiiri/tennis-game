<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Human Tennis Battle - Mushroom Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2f855a;
            touch-action: none;
            font-family: 'Arial', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            background-color: #38a169;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            margin: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }
        .score-box {
            background: rgba(255, 0, 0, 0.7);
            padding: 0.5rem 1.5rem;
            border: 3px solid white;
            border-radius: 1rem;
            text-align: center;
            min-width: 100px;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 2rem;
            border: 5px solid #e53e3e;
            border-radius: 1.5rem;
            color: #2d3748;
            text-align: center;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 20;
            width: 90%;
            max-width: 450px;
        }
        #stage-indicator {
            position: absolute;
            top: 110px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ffd700;
            font-weight: bold;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 5;
            background: rgba(0,0,0,0.4);
            padding: 5px 0;
            text-shadow: 2px 2px 0px #000;
        }
        #countdown-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0;
            font-size: 8rem;
            font-weight: 900;
            text-shadow: 6px 6px 0px #000;
            pointer-events: none;
            z-index: 30;
            display: none;
        }
        .game-btn {
            background-color: #e53e3e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-bottom: 4px solid #9b2c2c;
            border-radius: 0.75rem;
            font-weight: bold;
            margin: 0.4rem;
            cursor: pointer;
            transition: all 0.1s;
            pointer-events: auto;
            display: inline-block;
        }
        .game-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .char-card {
            border: 3px solid #e2e8f0;
            padding: 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }
        .char-card:hover, .char-card.selected {
            border-color: #e53e3e;
            background: #fff5f5;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="score-box" style="background: #4a5568;">
            <p class="text-xs opacity-90">ライバル</p>
            <p class="text-3xl font-bold" id="cpu-score">0</p>
        </div>
        <div class="score-box">
            <p class="text-xs opacity-90">あなた</p>
            <p class="text-3xl font-bold" id="player-score">0</p>
        </div>
    </div>

    <div id="stage-indicator">STAGE 1-1</div>
    <div id="countdown-display">3</div>

    <div id="message-box">
        <h2 id="msg-title" class="text-3xl font-bold mb-2 text-red-600">Mushroom Tennis</h2>
        
        <!-- Mode Select -->
        <div id="mode-selection">
            <p class="mb-4 font-bold">どうやってあそぶ？</p>
            <button class="game-btn" onclick="selectMode('singles')">ひとりで</button>
            <button class="game-btn" onclick="selectMode('doubles')">ふたりで</button>
        </div>

        <!-- Character Select -->
        <div id="char-selection" style="display:none;">
            <p class="mb-4 font-bold">だれにする？</p>
            <div class="grid grid-cols-3 gap-2 mb-4">
                <div class="char-card" id="char-0" onclick="pickChar(0)">
                    <div class="w-10 h-10 bg-red-600 rounded-full mx-auto mb-1 border-2 border-white"></div>
                    <div class="text-xs font-bold">マリオ風</div>
                    <div class="text-[10px] text-gray-500">バランス</div>
                </div>
                <div class="char-card" id="char-1" onclick="pickChar(1)">
                    <div class="w-10 h-10 bg-green-600 rounded-full mx-auto mb-1 border-2 border-white"></div>
                    <div class="text-xs font-bold">ルイージ風</div>
                    <div class="text-[10px] text-gray-500">スピード</div>
                </div>
                <div class="char-card" id="char-2" onclick="pickChar(2)">
                    <div class="w-10 h-10 bg-yellow-600 rounded-full mx-auto mb-1 border-2 border-white"></div>
                    <div class="text-xs font-bold">クッパ風</div>
                    <div class="text-[10px] text-gray-500">パワー</div>
                </div>
            </div>
            <button class="game-btn w-full" id="confirm-char" onclick="confirmCharacter()" style="opacity:0.5; pointer-events:none;">これにきめた！</button>
        </div>

        <!-- Start Button -->
        <div id="continue-selection" style="display:none;">
            <p id="msg-body" class="mb-4 text-gray-600 font-bold">準備OK？</p>
            <div id="timer-display" class="mb-2 font-bold text-red-600"></div>
            <button class="game-btn" id="start-btn" onclick="startCountdown()">スタート！</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pScoreEl = document.getElementById('player-score');
        const cScoreEl = document.getElementById('cpu-score');
        const stageEl = document.getElementById('stage-indicator');
        const countdownEl = document.getElementById('countdown-display');
        const messageBox = document.getElementById('message-box');
        const msgTitle = document.getElementById('msg-title');
        const msgBody = document.getElementById('msg-body');
        
        const modeSelection = document.getElementById('mode-selection');
        const charSelection = document.getElementById('char-selection');
        const continueSelection = document.getElementById('continue-selection');

        let tournamentStage = 0;
        let gameMode = 'singles'; 
        let isCountingDown = false;
        let startTime = 0;
        let lastClickTime = 0;
        let isPowerShot = false;

        const characters = [
            { name: "ハヤト", color: "#e53e3e", hatColor: "#fff", speedMult: 1.0, powerMult: 1.0 },
            { name: "サクラ", color: "#38a169", hatColor: "#fff", speedMult: 1.3, powerMult: 0.8 },
            { name: "ダイキ", color: "#d69e2e", hatColor: "#fff", speedMult: 0.7, powerMult: 1.5 }
        ];
        let selectedCharIndex = -1;

        const opponents = [
            { name: "クリボー風", speed: 3.5, ballSpeed: 6.5, color: "#975a16", label: "WORLD 1-1" },
            { name: "ノコノコ風", speed: 4.8, ballSpeed: 8.5, color: "#38a169", label: "WORLD 1-2" },
            { name: "テレサ風", speed: 5.8, ballSpeed: 10.0, color: "#edf2f7", label: "WORLD 1-3" },
            { name: "カメック風", speed: 7.0, ballSpeed: 11.5, color: "#3182ce", label: "WORLD 1-4" },
            { name: "クッパ風", speed: 8.5, ballSpeed: 13.5, color: "#d69e2e", label: "FINAL BATTLE" }
        ];

        let player = { x: 0, y: 0, score: 0, swing: 0, speed: 7.5, color: "#e53e3e", power: 1.0 };
        let partner = { x: 0, y: 0, swing: 0, speed: 6.0, color: "#fff", active: false };
        let cpu = { x: 0, y: 80, score: 0, speed: 3.0, color: "#975a16" };
        let cpuPartner = { x: 0, y: 80, swing: 0, speed: 3.0, color: "#38a169", active: false };
        let ball = { x: 0, y: 0, dx: 0, dy: 0, radius: 10, speed: 6, serving: true, effect: 0 };
       
        let keys = {};
        let gameActive = false;
        let animationId;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height * 0.85;
            partner.x = canvas.width * 0.3;
            partner.y = canvas.height * 0.7;
            cpu.x = canvas.width / 2;
            cpuPartner.x = canvas.width * 0.7;
        }

        window.addEventListener('resize', resize);
        resize();

        function selectMode(mode) {
            gameMode = mode;
            modeSelection.style.display = 'none';
            charSelection.style.display = 'block';
        }

        function pickChar(index) {
            selectedCharIndex = index;
            document.querySelectorAll('.char-card').forEach((c, i) => {
                c.classList.toggle('selected', i === index);
            });
            const btn = document.getElementById('confirm-char');
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
        }

        function confirmCharacter() {
            const char = characters[selectedCharIndex];
            player.color = char.color;
            player.speed = 8.5 * char.speedMult;
            player.power = char.powerMult;
            
            charSelection.style.display = 'none';
            continueSelection.style.display = 'block';
            msgBody.textContent = `このキャラで冒険にでかけよう！`;
        }

        function startCountdown() {
            if (tournamentStage === 0) startTime = Date.now();
            messageBox.style.display = 'none';
            isCountingDown = true;
            countdownEl.style.display = 'block';
            let count = 3;
            countdownEl.textContent = count;
            const timer = setInterval(() => {
                count--;
                if (count === 0) countdownEl.textContent = "GO!";
                else if (count < 0) {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    isCountingDown = false;
                    nextMatch();
                } else countdownEl.textContent = count;
            }, 800);
        }

        function registerClick() {
            const now = Date.now();
            if (now - lastClickTime < 300) isPowerShot = true;
            else isPowerShot = false;
            lastClickTime = now;
        }

        function handleInteraction(clientX, clientY) {
            if (!gameActive || isCountingDown) return;
            const rect = canvas.getBoundingClientRect();
            player.x = clientX - rect.left;
            const mouseY = clientY - rect.top;
            if (mouseY > canvas.height / 2 + 50) player.y = mouseY;
        }

        canvas.addEventListener('mousemove', (e) => handleInteraction(e.clientX, e.clientY));
        canvas.addEventListener('mousedown', registerClick);
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
            registerClick();
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
        }, { passive: false });

        function resetBall(isPlayerServe) {
            ball.serving = true;
            ball.effect = 0;
            ball.speed = opponents[Math.min(tournamentStage, opponents.length - 1)].ballSpeed;
            if (isPlayerServe) {
                ball.y = player.y - 45;
                ball.x = player.x + 20;
            } else {
                ball.serving = false;
                ball.x = cpu.x;
                ball.y = cpu.y + 45;
                ball.dy = ball.speed;
                ball.dx = (Math.random() - 0.5) * 8;
            }
        }

        function nextMatch() {
            const config = opponents[tournamentStage];
            cpu.speed = config.speed;
            cpu.color = config.color;
            cpuPartner.speed = config.speed * 0.9;
            cpuPartner.color = config.color;
            stageEl.textContent = config.label;
            
            partner.active = (gameMode === 'doubles');
            cpuPartner.active = (gameMode === 'doubles');

            player.score = 0; cpu.score = 0;
            updateScoreDisplay();
            resetBall(true);
            messageBox.style.display = 'none';
            gameActive = true;
            if (animationId) cancelAnimationFrame(animationId);
            draw();
        }

        function updateScoreDisplay() {
            pScoreEl.textContent = player.score;
            cScoreEl.textContent = cpu.score;
            if (player.score >= 5 || cpu.score >= 5) {
                gameActive = false;
                if (player.score >= 5) {
                    tournamentStage++;
                    if (tournamentStage >= opponents.length) {
                        msgTitle.textContent = "🏆 ピーチを救った！ 🏆";
                        msgBody.textContent = `あなたは真のスーパーヒーローです！`;
                        tournamentStage = 0;
                        modeSelection.style.display = 'block';
                        continueSelection.style.display = 'none';
                    } else {
                        msgTitle.textContent = "コースクリア！";
                        msgBody.textContent = "つぎのワールドへいこう！";
                        continueSelection.style.display = 'block';
                    }
                } else {
                    msgTitle.textContent = "ミス！";
                    msgBody.textContent = "あきらめないでもういっかい！";
                    tournamentStage = 0;
                    continueSelection.style.display = 'block';
                }
                setTimeout(() => { messageBox.style.display = 'block'; }, 500);
            }
        }

        function drawCharacter(x, y, isPlayerSide, swingFrame, color) {
            ctx.save();
            ctx.translate(x, y);
            
            // Shadow
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.beginPath(); ctx.ellipse(0, 10, 22, 10, 0, 0, Math.PI * 2); ctx.fill();

            // Head (Hat)
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(0, -42, 12, Math.PI, 0); ctx.fill(); // Top of hat
            ctx.fillRect(-15, -42, 30, 4); // Brim
            ctx.fillStyle = "#ffdbac"; // Skin
            ctx.beginPath(); ctx.arc(0, -32, 10, 0, Math.PI * 2); ctx.fill();
            
            // Mustache/Mouth
            ctx.fillStyle = "#4a2c2c";
            ctx.fillRect(-5, -30, 10, 2);

            // Body (Overalls)
            ctx.fillStyle = isPlayerSide ? "#2b6cb0" : color; // Blue overalls for player
            ctx.fillRect(-12, -25, 24, 20);
            ctx.fillStyle = isPlayerSide ? color : "#2b6cb0"; // Shirt color
            ctx.fillRect(-12, -25, 5, 20);
            ctx.fillRect(7, -25, 5, 20);
            
            // Shoes
            ctx.fillStyle = "#4a2c2c";
            ctx.fillRect(-14, -5, 10, 8);
            ctx.fillRect(4, -5, 10, 8);

            // Racket
            let armAngle = isPlayerSide ? (swingFrame > 0 ? -Math.PI/1.2 : Math.PI/4) : Math.PI/4;
            ctx.save();
            ctx.translate(0, -20); ctx.rotate(armAngle);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(25, 0); ctx.stroke();
            ctx.translate(25, 0);
            ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.ellipse(15, 0, 10, 15, Math.PI/2, 0, Math.PI*2); ctx.stroke();
            ctx.restore();

            ctx.restore();
        }

        function update() {
            if (!gameActive || isCountingDown) return;

            player.x = Math.max(45, Math.min(canvas.width - 45, player.x));
            player.y = Math.max(canvas.height / 2 + 50, Math.min(canvas.height - 45, player.y));

            const targetCpu = (gameMode === 'doubles' && ball.x > canvas.width/2) ? cpuPartner : cpu;
            if (targetCpu.x < ball.x - 5) targetCpu.x += targetCpu.speed;
            else if (targetCpu.x > ball.x + 5) targetCpu.x -= targetCpu.speed;

            if (ball.serving) {
                if (!ball.serveTimer) ball.serveTimer = setTimeout(() => {
                    ball.serving = false;
                    ball.dy = -ball.speed;
                    ball.dx = (Math.random() - 0.5) * 8;
                    player.swing = 15;
                    ball.serveTimer = null;
                }, 1500);
                return;
            }

            ball.x += ball.dx; ball.y += ball.dy;
            if (ball.x < 30 || ball.x > canvas.width - 30) ball.dx *= -1;

            const checkHit = (h, isMainPlayer) => {
                if (ball.dy > 0 && Math.abs(ball.y - h.y) < 65 && Math.abs(ball.x - h.x) < 55) {
                    h.swing = 15;
                    let currentSpeed = ball.speed;
                    if (isMainPlayer) {
                        currentSpeed *= player.power;
                        if (isPowerShot) {
                            currentSpeed *= 1.6;
                            ball.effect = 25;
                            isPowerShot = false;
                        } else {
                            ball.effect = 0;
                        }
                    }
                    ball.dy = -currentSpeed;
                    ball.dx = (ball.x - h.x) * 0.45;
                }
            };
            checkHit(player, true);
            if (partner.active) {
                if (ball.dy > 0 && ball.y < player.y - 100) {
                    if (partner.x < ball.x) partner.x += partner.speed;
                    else partner.x -= partner.speed;
                }
                checkHit(partner, false);
            }

            const cpuHit = (c) => {
                if (ball.dy < 0 && (Math.abs(ball.y - c.y) < 45 && Math.abs(ball.x - c.x) < 55)) {
                    ball.dy = ball.speed; ball.dx = (ball.x - c.x) * 0.45;
                    ball.effect = 0;
                }
            }
            cpuHit(cpu);
            if (cpuPartner.active) cpuHit(cpuPartner);

            if (ball.y < 0) { player.score++; updateScoreDisplay(); if (gameActive) resetBall(false); }
            else if (ball.y > canvas.height) { cpu.score++; updateScoreDisplay(); if (gameActive) resetBall(true); }

            if (player.swing > 0) player.swing--;
            if (partner.swing > 0) partner.swing--;
            if (ball.effect > 0) ball.effect--;
        }

        function draw() {
            // Field
            ctx.fillStyle = "#38a169"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Court Lines
            ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 4;
            ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
            ctx.beginPath(); ctx.moveTo(30, canvas.height / 2); ctx.lineTo(canvas.width - 30, canvas.height / 2); ctx.stroke();
            
            // Ball
            ctx.save();
            if (ball.effect > 0) {
                ctx.shadowBlur = 20; ctx.shadowColor = "#f00";
                ctx.fillStyle = "#ff4d4d";
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius + 3, 0, Math.PI * 2); ctx.fill();
                // Star particle effect
                ctx.fillStyle = "#fff"; ctx.fillRect(ball.x + Math.random()*20-10, ball.y + Math.random()*20-10, 4, 4);
            } else {
                ctx.fillStyle = "#ff0";
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
            }
            ctx.restore();

            // Characters
            drawCharacter(player.x, player.y, true, player.swing, player.color);
            if (partner.active) drawCharacter(partner.x, partner.y, true, partner.swing, partner.color);
            drawCharacter(cpu.x, cpu.y, false, 0, cpu.color);
            if (cpuPartner.active) drawCharacter(cpuPartner.x, cpuPartner.y, false, 0, cpuPartner.color);

            update();
            if (gameActive || isCountingDown) animationId = requestAnimationFrame(draw);
        }

        window.onload = () => { messageBox.style.display = 'block'; };
    </script>
</body>
</html>
