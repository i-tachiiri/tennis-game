<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神経衰弱タイムアタック</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card-front {
            background-color: #ffffff;
            transform: rotateY(180deg);
        }
        .card-back {
            background-image: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            font-size: 1.5rem;
        }
        .matched {
            opacity: 0.3;
            cursor: default;
            transform: scale(0.9);
            transition: all 0.3s;
        }
        
        @keyframes scaleUp {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .countdown-number {
            animation: scaleUp 1s ease-in-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center py-8 px-4 font-sans text-slate-800">

    <div class="max-w-md w-full relative">
        <!-- 音量コントロール -->
        <button id="mute-btn" class="absolute -top-12 right-0 bg-white p-2 rounded-full shadow-sm border border-slate-200 text-slate-500 hover:text-blue-500 transition">
            <span id="mute-icon">🔊</span>
        </button>

        <!-- スタート画面 -->
        <div id="start-screen" class="bg-white rounded-3xl p-8 shadow-xl text-center border border-slate-200">
            <h1 class="text-3xl font-extrabold mb-6 text-blue-600">Memory Attack</h1>
            <div class="mb-6 text-left">
                <label class="block text-sm font-bold text-slate-500 mb-2 uppercase tracking-wider">Player Name</label>
                <input type="text" id="player-name-input" placeholder="名前を入力してください" 
                    class="w-full px-4 py-3 rounded-xl border-2 border-slate-100 focus:border-blue-500 outline-none transition text-lg">
            </div>
            <button id="start-game-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg text-lg">
                ゲーム開始
            </button>
        </div>

        <!-- メインゲームエリア -->
        <div id="game-area" class="hidden">
            <h1 class="text-2xl font-extrabold mb-4 text-center text-blue-600">Memory Attack</h1>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-3 rounded-xl shadow-sm text-center">
                    <p class="text-[10px] text-slate-500 uppercase font-bold text-left px-2">Time</p>
                    <p id="timer" class="text-xl font-mono font-bold">0.0s</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm text-center">
                    <p class="text-[10px] text-slate-500 uppercase font-bold text-left px-2">Moves</p>
                    <p id="moves" class="text-xl font-mono font-bold">0</p>
                </div>
            </div>

            <div id="game-board" class="grid grid-cols-4 gap-3 perspective mb-6"></div>
            
            <button id="give-up-btn" class="text-slate-400 hover:text-slate-600 text-sm block mx-auto underline">
                タイトルに戻る
            </button>
        </div>

        <!-- カウントダウンオーバーレイ -->
        <div id="countdown-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/20 pointer-events-none">
            <span id="countdown-text" class="text-9xl font-black text-white drop-shadow-2xl italic"></span>
        </div>

        <!-- リザルト画面 -->
        <div id="win-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl overflow-hidden">
                <div class="text-center mb-6">
                    <div class="text-5xl mb-2">🏆</div>
                    <h2 class="text-2xl font-bold">Result</h2>
                </div>
                
                <div class="flex justify-around mb-8 bg-blue-50 p-4 rounded-2xl">
                    <div class="text-center">
                        <p class="text-xs text-blue-400 font-bold uppercase">Time</p>
                        <p id="final-time" class="text-xl font-bold text-blue-700"></p>
                    </div>
                    <div class="text-center border-l border-blue-200 pl-4">
                        <p class="text-xs text-blue-400 font-bold uppercase">Moves</p>
                        <p id="final-moves" class="text-xl font-bold text-blue-700"></p>
                    </div>
                </div>

                <div class="mb-8">
                    <h3 class="text-sm font-bold text-slate-400 mb-3 flex items-center">
                        <span class="mr-2">📊</span> Ranking (Top 5)
                    </h3>
                    <ol id="ranking-list" class="space-y-2"></ol>
                </div>

                <div class="space-y-3">
                    <button id="modal-retry-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-md">
                        名前を変えて挑戦
                    </button>
                    <button id="modal-fast-retry-btn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition">
                        同じ名前で再戦
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Sound Engine (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;

        function playSound(type) {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'countdown') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'start') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'win') {
                const frequencies = [523.25, 659.25, 783.99, 1046.50];
                frequencies.forEach((f, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(f, now + i * 0.1);
                    g.gain.setValueAtTime(0.1, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.5);
                });
            }
        }

        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const gameArea = document.getElementById('game-area');
        const board = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const timerDisplay = document.getElementById('timer');
        const rankingList = document.getElementById('ranking-list');
        const winModal = document.getElementById('win-modal');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownText = document.getElementById('countdown-text');
        
        const playerNameInput = document.getElementById('player-name-input');
        const startGameBtn = document.getElementById('start-game-btn');
        const giveUpBtn = document.getElementById('give-up-btn');
        const modalRetryBtn = document.getElementById('modal-retry-btn');
        const modalFastRetryBtn = document.getElementById('modal-fast-retry-btn');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');

        // --- Game State ---
        const symbols = ['🍎', '💎', '🚗', '👻', '⭐️', '🍀', '🏀', '☀️'];
        let cards = [...symbols, ...symbols];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isProcessing = false;
        let startTime = null;
        let timerInterval = null;
        let currentPlayer = "Player";
        let rankings = [];

        // --- Functions ---

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function startCountdown() {
            startScreen.classList.add('hidden');
            gameArea.classList.remove('hidden');
            countdownOverlay.classList.remove('hidden');
            
            const counts = ['3', '2', '1', 'START!'];
            for (let i = 0; i < counts.length; i++) {
                const text = counts[i];
                countdownText.textContent = text;
                
                // Sound
                if (text === 'START!') playSound('start');
                else playSound('countdown');

                countdownText.classList.remove('countdown-number');
                void countdownText.offsetWidth; 
                countdownText.classList.add('countdown-number');
                await new Promise(r => setTimeout(r, 1000));
            }
            
            countdownOverlay.classList.add('hidden');
            beginGame();
        }

        function beginGame() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timerDisplay.textContent = elapsed.toFixed(1) + 's';
            }, 100);
        }

        function initGameBoard() {
            board.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            isProcessing = false;
            movesDisplay.textContent = moves;
            timerDisplay.textContent = '0.0s';
            winModal.classList.add('hidden');

            const shuffledCards = shuffle([...cards]);
            shuffledCards.forEach((symbol, index) => {
                board.appendChild(createCardElement(symbol, index));
            });
        }

        function createCardElement(symbol, index) {
            const container = document.createElement('div');
            container.className = 'aspect-[3/4] relative';
            const inner = document.createElement('div');
            inner.className = 'card-inner';
            inner.dataset.symbol = symbol;
            
            inner.innerHTML = `
                <div class="card-front border-2 border-slate-100 text-3xl">${symbol}</div>
                <div class="card-back text-xl font-bold italic">?</div>
            `;

            inner.addEventListener('click', () => handleCardClick(inner));
            container.appendChild(inner);
            return container;
        }

        function handleCardClick(card) {
            if (isProcessing || card.classList.contains('is-flipped') || card.classList.contains('matched') || !startTime) return;

            playSound('flip');
            card.classList.add('is-flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const [c1, c2] = flippedCards;

            if (c1.dataset.symbol === c2.dataset.symbol) {
                setTimeout(() => {
                    playSound('match');
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    matchedPairs++;
                    flippedCards = [];
                    isProcessing = false;
                    if (matchedPairs === symbols.length) finishGame();
                }, 500);
            } else {
                setTimeout(() => {
                    playSound('wrong');
                    c1.classList.remove('is-flipped');
                    c2.classList.remove('is-flipped');
                    flippedCards = [];
                    isProcessing = false;
                }, 800);
            }
        }

        function finishGame() {
            clearInterval(timerInterval);
            const finalTime = (Date.now() - startTime) / 1000;
            playSound('win');
            
            rankings.push({ 
                name: currentPlayer, 
                time: finalTime, 
                moves: moves 
            });
            rankings.sort((a, b) => a.time - b.time);
            rankings = rankings.slice(0, 5);

            document.getElementById('final-time').textContent = finalTime.toFixed(2) + 's';
            document.getElementById('final-moves').textContent = moves;
            
            updateRankingUI();
            winModal.classList.remove('hidden');
        }

        function updateRankingUI() {
            rankingList.innerHTML = rankings.map((r, i) => `
                <li class="flex justify-between items-center p-2 rounded-xl ${i === 0 ? 'bg-yellow-50 border border-yellow-200' : 'bg-slate-50'}">
                    <div class="flex items-center">
                        <span class="w-6 text-xs font-bold ${i === 0 ? 'text-yellow-600' : 'text-slate-400'}">${i + 1}</span>
                        <span class="font-bold text-sm truncate max-w-[100px]">${r.name}</span>
                    </div>
                    <div class="text-right">
                        <span class="font-mono font-bold text-blue-600 text-sm">${r.time.toFixed(2)}s</span>
                    </div>
                </li>
            `).join('');
        }

        // --- Event Listeners ---

        startGameBtn.addEventListener('click', () => {
            // Web Audio APIの有効化 (ユーザージェスチャが必要)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const name = playerNameInput.value.trim();
            if (!name) {
                playerNameInput.classList.add('border-red-500');
                setTimeout(() => playerNameInput.classList.remove('border-red-500'), 1000);
                return;
            }
            currentPlayer = name;
            initGameBoard();
            startCountdown();
        });

        giveUpBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            startTime = null;
            gameArea.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        // 名前を変えて再挑戦 (名前入力画面に戻る)
        modalRetryBtn.addEventListener('click', () => {
            winModal.classList.add('hidden');
            gameArea.classList.add('hidden');
            startScreen.classList.remove('hidden');
            playerNameInput.focus();
        });

        // 同じ名前で再挑戦 (そのままカウントダウンへ)
        modalFastRetryBtn.addEventListener('click', () => {
            initGameBoard();
            startCountdown();
        });

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteIcon.textContent = isMuted ? '🔇' : '🔊';
        });

    </script>
</body>
</html>
